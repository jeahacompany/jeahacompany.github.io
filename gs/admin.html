<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>히든벨리 펜션 · 예약 관리자</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  color-scheme:light;
  --paper:#f5f2ec;--panel:#ffffff;--panel2:#f3f0e9;--ink:#22302a;--sub:#5c665b;--faint:#9aa295;
  --forest:#22402d;--forest-d:#1a3223;--moss:#5f8352;--clay:#bf8552;--clay-d:#9c6532;--line:#e7e3d9;--line2:#efece4;
  --shadow:0 1px 2px rgba(28,40,30,.04),0 8px 22px -16px rgba(28,40,30,.15);
  --shadow-lift:0 2px 6px rgba(28,40,30,.05),0 14px 30px -18px rgba(28,40,30,.20);
  --req:#9a6f18;--req-bg:#f7edd3;--con:#2f6b3f;--con-bg:#e4efe2;--can:#b0493b;--can-bg:#f6e4df;
  --serif:"Nanum Myeongjo",serif;--sans:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:"Pretendard Variable","Pretendard",sans-serif;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);margin:0;letter-spacing:-.01em}
.mono,.num{font-variant-numeric:tabular-nums}
button{font-family:var(--sans);cursor:pointer}
.hidden{display:none!important}
#dashView{display:flex;min-height:100vh}
.side{position:sticky;top:0;align-self:flex-start;height:100vh;width:214px;flex:0 0 214px;background:linear-gradient(180deg,#284a32,#1a3223);color:#dfe7dc;display:flex;flex-direction:column;padding:22px 14px;z-index:20}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.side-brand .mark{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.15rem;color:#fff;font-weight:800}
.side-brand b{font-family:var(--serif);font-size:1.12rem;color:#fff;display:block;line-height:1.15}
.side-brand span{font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:#a9c4a0}
.side-nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.side-nav button{display:flex;align-items:center;gap:11px;border:none;background:transparent;color:#cfe0c6;font-size:.9rem;font-weight:500;padding:.72em .8em;border-radius:9px;text-align:left;border-left:3px solid transparent;transition:.15s}
.side-nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.side-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.side-nav button.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--clay)}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:8px}
.side-foot .who{font-size:.78rem;color:#bcd0b2;padding:0 8px 2px}
.tbtn{width:100%;text-align:left;background:transparent;color:#cfe0c6;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:.5em .8em;font-size:.82rem;font-weight:500;transition:.15s}
.tbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.main{flex:1;min-width:0;padding:26px 32px 64px;max-width:1180px}
@media(max-width:820px){#dashView{flex-direction:column}.side{width:auto;flex:none;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;padding:10px 14px;gap:6px}.side-brand{padding:0 8px 0 2px}.side-brand span{display:none}.side-nav{flex-direction:row;margin:0;gap:2px}.side-nav button{padding:.5em .7em;border-left:none;border-bottom:3px solid transparent;border-radius:7px}.side-nav button span{display:none}.side-nav button.active{border-left:none;border-bottom-color:var(--clay)}.side-foot{margin:0 0 0 auto;padding:0;border:none;flex-direction:row}.side-foot .who{display:none}.tbtn{width:auto;padding:.45em .7em}.main{padding:20px 16px 48px}}
/* login */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:38px 34px}
.login .bm{text-align:center;margin-bottom:24px}.login .bm b{font-family:var(--serif);font-size:1.35rem;display:block}
.login .bm span{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--moss)}
.login h2{font-size:1.15rem;margin-bottom:4px}.login .hint{color:var(--sub);font-size:.85rem;margin-bottom:22px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:.76rem;font-weight:600;color:var(--sub)}
.fld input,.fld select{font-family:var(--sans);font-size:.98rem;padding:.62em .8em;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 3px color-mix(in srgb,var(--moss) 22%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font-weight:600;font-size:.9rem;padding:.66em 1.15em;border-radius:9px;border:1px solid transparent;background:var(--forest);color:#fff;transition:.15s}
.btn:hover{background:var(--forest-d)}.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.line{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:none}.btn.line:hover{border-color:var(--moss);background:var(--panel2)}
.msg{font-size:.85rem;margin-top:12px;min-height:1.1em}.msg.err{color:var(--can)}
/* page head */
.phead{display:flex;align-items:baseline;gap:14px;margin:2px 0 22px;flex-wrap:wrap}
.phead h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
.phead .date{color:var(--faint);font-size:.82rem;margin-left:auto}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.18s}
.tile:hover{box-shadow:var(--shadow)}
.tile .lab{font-size:.76rem;color:var(--sub);font-weight:500;letter-spacing:.01em}
.tile .v{font-family:var(--serif);font-size:1.75rem;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.tile .v small{font-size:.8rem;color:var(--faint);font-weight:400;font-family:var(--sans);margin-left:2px}
.tile.sales .v{color:var(--clay-d)}.tile.con .v{color:var(--con)}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}.tile.sales{grid-column:span 2}}
/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chips{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.chips button{border:none;background:transparent;color:var(--sub);font-size:.84rem;font-weight:600;padding:.45em .8em;border-radius:8px;white-space:nowrap}
.chips button.active{background:var(--panel);color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chips .c{font-family:var(--mono);font-size:.78em;opacity:.7;margin-left:3px}
.search{position:relative;flex:1;max-width:240px;min-width:150px}
.search input{width:100%;padding:.55em .8em .55em 2.1em;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:.88rem}
.search svg{position:absolute;left:.65em;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint)}
/* table */
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.tblscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:820px}
thead th{background:var(--panel2);color:var(--sub);font-weight:600;font-size:.76rem;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.r{text-align:right}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:var(--panel2)}
.sched b{font-weight:600;font-variant-numeric:tabular-nums}.sched span,.guest a{display:block;font-size:.76rem;color:var(--faint)}
.guest b{font-weight:600}.guest a{color:var(--moss);text-decoration:none;font-variant-numeric:tabular-nums}
.amt{font-family:var(--serif);font-size:1rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.applied{color:var(--faint);font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:.26em .7em;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-req{background:var(--req-bg);color:var(--req)}.p-con{background:var(--con-bg);color:var(--con)}.p-can{background:var(--can-bg);color:var(--can)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.mini{font-size:.8rem;font-weight:600;padding:.4em .7em;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.mini:hover{border-color:var(--faint)}.mini.pri{background:var(--con);border-color:var(--con);color:#fff}.mini.dang{color:var(--can);border-color:color-mix(in srgb,var(--can) 40%,var(--line))}
.dash{color:var(--faint)}
.state{padding:50px 20px;text-align:center;color:var(--sub)}.state b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--ink);margin-bottom:4px}
/* calendar */
.calbar{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.calbar b{font-family:var(--serif);font-size:1.2rem;min-width:120px;text-align:center}
.calbar button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:.76rem;font-weight:600;color:var(--faint);padding:4px 0}
.cal .wd.sun{color:var(--can)}.cal .wd.sat{color:#3a6ea5}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px}
.cell.empty{background:transparent;border:none}
.cell .dnum{font-size:.78rem;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.cell .dnum.today{background:var(--forest);color:#fff;border-radius:6px;padding:0 5px;align-self:flex-start}
.rvchip{font-size:.72rem;padding:.15em .4em;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.rvchip.req{background:var(--req-bg);border-color:var(--req);color:var(--req)}
.rvchip.con{background:var(--con-bg);border-color:var(--con);color:var(--con)}
@media(max-width:700px){.cell{min-height:70px}.rvchip{font-size:.62rem}}
/* settings */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:24px 26px;margin-bottom:18px}
.sec h3{font-size:1.2rem;font-weight:700;margin-bottom:4px;padding-left:12px;position:relative}
.sec h3::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:3px;border-radius:2px;background:var(--clay)}
.sec .d{color:var(--sub);font-size:.86rem;margin-bottom:16px}
.pmatrix{width:100%;border-collapse:collapse;font-size:.88rem;min-width:520px}
.pmatrix th,.pmatrix td{border:1px solid var(--line2);padding:7px 8px;text-align:center}
.pmatrix th{background:var(--panel2);color:var(--sub);font-weight:600;font-size:.78rem}
.pmatrix td:first-child,.pmatrix th:first-child{text-align:left;font-weight:600}
.pmatrix input{width:92px;padding:.35em .4em;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.85rem}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.srow input{padding:.4em .6em;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);width:90px;text-align:center;font-family:var(--mono)}
.srow .x{color:var(--can);cursor:pointer;font-weight:700;padding:0 4px}
.siteform{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
.siteform .sf{display:flex;flex-direction:column;gap:5px}
.siteform .sf span{font-size:.8rem;font-weight:600;color:var(--sub)}
.siteform .sf input{padding:.55em .7em;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);font-size:.92rem}
.siteform .sf input:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 3px color-mix(in srgb,var(--moss) 20%,transparent)}
@media(max-width:640px){.siteform{grid-template-columns:1fr}}
.optrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.optrow:first-child{border-top:0}
.optrow input[type=text]{padding:.45em .6em;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink)}
.optrow .o-name{flex:1;min-width:150px}
.optrow .rchk{display:flex;align-items:center;gap:5px;font-size:.88rem;color:var(--ink)}
.optnew{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.optnew input{padding:.5em .7em;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink)}
.optnew #noName{flex:1;min-width:160px}
.hol-list{display:flex;flex-wrap:wrap;gap:8px}
.holchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.35em .8em;font-size:.85rem;color:var(--ink);font-family:var(--mono)}
.holchip .x{color:var(--can);cursor:pointer;font-weight:700}
.seas-block{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.seas-block .h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.rooms-edit{overflow-x:auto}
/* 객실 아코디언(상품카드) */
.room-list{display:flex;flex-direction:column;gap:12px}
.racc{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.racc[open]{box-shadow:var(--shadow-lift)}
.racc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px 16px;transition:.15s}
.racc summary::-webkit-details-marker{display:none}
.racc summary:hover{background:var(--panel2)}
.racc .rthumb{width:64px;height:48px;border-radius:9px;object-fit:cover;background:var(--line);flex-shrink:0}
.rsum{flex:1;min-width:0}.rsum b{font-family:var(--serif);font-size:1.05rem}.rsum span{display:block;font-size:.8rem;color:var(--sub)}
.rbadge{font-size:.72rem;font-weight:700;padding:.22em .7em;border-radius:999px;white-space:nowrap}
.rbadge.on{background:var(--con-bg);color:var(--con)}.rbadge.off{background:var(--line2);color:var(--faint)}
.racc .chev{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.2s;flex-shrink:0}
.racc[open] .chev{transform:rotate(180deg)}
.rbody{padding:4px 16px 18px;border-top:1px solid var(--line2)}
.rblk{padding:16px 0;border-bottom:1px dashed var(--line)}
.rblk:last-child{border-bottom:none}
.rblk-t{font-size:.8rem;font-weight:700;color:var(--forest);margin-bottom:10px;letter-spacing:.02em}
.rphoto{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rphoto .pthumb{width:150px;aspect-ratio:4/3;border-radius:10px;flex-shrink:0}
.rphoto-a{display:flex;gap:8px;flex-wrap:wrap}
.rinfo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;max-width:440px}
.rinfo label{display:flex;flex-direction:column;gap:5px;font-size:.76rem;font-weight:600;color:var(--sub)}
.rinfo input[type=text],.rinfo input[type=number]{padding:.5em .7em;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);font-size:.95rem;width:100%}
.rinfo .rchk{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-size:.9rem;color:var(--ink)}
.rinfo .rchk input{width:18px;height:18px}
@media(max-width:560px){.rinfo{grid-template-columns:1fr}}
/* 요금 입력(콤마) */
.pmatrix{width:100%;min-width:0}
.pcell{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.pinp{width:100%;max-width:110px;padding:.45em .6em;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;font-family:var(--sans);font-size:.92rem;font-weight:600}
.pinp:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 3px color-mix(in srgb,var(--moss) 20%,transparent)}
.wsuffix{font-size:.78rem;color:var(--faint)}
.pmatrix td:first-child,.pmatrix th:first-child{text-align:left}
.pmatrix th{font-weight:600;color:var(--sub);font-size:.8rem;background:var(--panel2)}
.pmatrix td{padding:8px 10px}
/* 객실 사진 여러장 */
.rpgal{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.rpitem{position:relative;width:120px;height:90px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--line)}
.rpitem img{width:100%;height:100%;object-fit:cover;display:block}
.rpn{position:absolute;left:5px;top:5px;font-size:.64rem;font-weight:700;padding:.14em .5em;border-radius:999px;background:rgba(31,42,34,.72);color:#fff}
.rpx{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(176,73,59,.92);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.rpx:hover{background:var(--can)}
.rpadd{width:120px;height:90px;border-radius:10px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;color:var(--moss);cursor:pointer;background:var(--panel2);transition:.15s;text-align:center}
.rpadd:hover{border-color:var(--moss);background:#eef4e8}
.rpempty{color:var(--faint);font-size:.85rem}
.rphint{font-size:.76rem;color:var(--faint);margin-top:8px}
.pgrp{margin-bottom:18px}.pgrp-t{font-weight:600;font-size:.9rem;color:var(--sub);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.pgrid-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.pthumb{position:relative;aspect-ratio:4/3;background:var(--line)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pbadge{position:absolute;top:6px;left:6px;font-size:.66rem;font-weight:700;padding:.16em .5em;border-radius:999px;background:var(--line);color:var(--sub)}
.pbadge.on{background:var(--con-bg);color:var(--con)}
.plabel{font-size:.82rem;font-weight:600;padding:8px 10px 0}
.pacts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px 10px}
.pacts .mini{width:100%}
.re-tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:560px}
.re-tbl th,.re-tbl td{border-bottom:1px solid var(--line2);padding:8px 10px;text-align:left}
.re-tbl th{background:var(--panel2);color:var(--sub);font-size:.76rem}
.re-tbl input[type=text],.re-tbl input[type=number]{padding:.35em .5em;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);width:90px}
.re-tbl input[type=text]{width:110px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-m{width:58px;flex-shrink:0;font-size:.8rem;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.bar-track{flex:1;height:22px;background:var(--panel2);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--forest));border-radius:7px;min-width:2px;transition:width .4s}
.bar-fill.r{background:linear-gradient(90deg,#d9a05f,var(--clay))}
.bar-v{width:150px;flex-shrink:0;text-align:right;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.bar-v em{color:var(--faint);font-style:normal;font-weight:400;font-size:.9em}
@media(max-width:600px){.bar-v{width:104px;font-size:.74rem}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:.7em 1.2em;border-radius:10px;font-size:.88rem;font-weight:500;box-shadow:var(--shadow);z-index:60;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,15,10,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:440px;padding:26px 26px 22px;max-height:90vh;overflow:auto}
.modal h3{font-size:1.2rem;margin-bottom:16px}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.cards{display:none;flex-direction:column;gap:12px;padding:12px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--panel)}
.rcard .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.86rem;margin:0}
.rcard dt{color:var(--faint)}.rcard dd{margin:0;text-align:right}
@media(max-width:760px){.tblscroll{display:none}.cards{display:flex}}
.foot-note{margin-top:26px;text-align:center;color:var(--faint);font-size:.78rem}
.listmeta{font-size:.8rem;color:var(--faint);margin:2px 2px 10px}
#periods button.active{background:var(--clay);color:#fff}
.dtl{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.dtl-row{display:flex;padding:11px 14px;border-bottom:1px solid var(--line2);font-size:.92rem}
.dtl-row:last-child{border-bottom:none}
.dtl-row:nth-child(odd){background:var(--panel2)}
.dtl-k{width:110px;flex-shrink:0;color:var(--sub);font-weight:600}
.dtl-v{flex:1;color:var(--ink)}
.btn.line.dang2{color:var(--can);border-color:color-mix(in srgb,var(--can) 40%,var(--line))}
.btn.line.dang2:hover{background:var(--can-bg);border-color:var(--can)}
</style>
</head>
<body>

<div id="loginView" class="login-shell">
  <div class="login">
    <div class="bm"><b>히든벨리 펜션</b><span>Hidden Valley</span></div>
    <h2>예약 관리자</h2><div class="hint">예약·요금·객실을 직접 관리하는 페이지입니다.</div>
    <div class="fld"><label for="u">아이디</label><input id="u" autocomplete="username" placeholder="admin"></div>
    <div class="fld"><label for="p">비밀번호</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••"></div>
    <button class="btn" id="loginBtn" style="width:100%">로그인</button>
    <div class="msg err" id="loginMsg"></div>
  </div>
</div>

<div id="dashView" class="hidden">
  <aside class="side">
    <div class="side-brand"><span class="mark">H</span><div><b>히든벨리</b><span>Hidden Valley</span></div></div>
    <nav class="side-nav" id="vtabs">
      <button data-v="list" class="active"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>예약</span></button>
      <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>캘린더</span></button>
      <button data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>요금·객실</span></button>
      <button data-v="stats"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M8 17V9M13 17V5M18 17v-6"/></svg><span>매출</span></button>
    </nav>
    <div class="side-foot">
      <span class="who" id="who"></span>
      <button class="tbtn" id="refreshBtn">새로고침</button>
      <button class="tbtn" id="logoutBtn">로그아웃</button>
    </div>
  </aside>
  <main class="main">
    <div class="phead">
      <h1 id="ptitle">예약 현황</h1>
      <span class="date" id="today"></span>
    </div>
    <div id="viewList"></div>
    <div id="viewCal" class="hidden"></div>
    <div id="viewSettings" class="hidden"></div>
    <div id="viewStats" class="hidden"></div>
    <div class="foot-note">히든벨리 펜션 예약관리 · 도반글로벌</div>
  </main>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB=supabase.createClient('https://epxjjvowhlxaksviyhus.supabase.co','sb_publishable_VMd564QhmwzjRtmeMgklgg_pQaamR1M');
const el=id=>document.getElementById(id);
const won=n=>Number(n||0).toLocaleString('ko-KR');
let TOKEN=localStorage.getItem('gs_admin_token')||null;
let ALL=[],CFG=null,PHOTOS={},VIEW='list',FILTER='all',PERIOD='all',Q='',calRef=new Date();
function roomName(id){const r=(CFG&&CFG.rooms||[]).find(x=>x.id===id);return r?r.name:id;}
function todayStr(){return fday(new Date());}
function periodMatch(created){if(PERIOD==='all')return true;const d=fday(created),t=new Date();t.setHours(0,0,0,0);const cd=new Date(created);cd.setHours(0,0,0,0);
  if(PERIOD==='today')return d===todayStr();
  if(PERIOD==='week')return (t-cd)/864e5<7 && cd<=t;
  if(PERIOD==='month'){const n=new Date();return cd.getFullYear()===n.getFullYear()&&cd.getMonth()===n.getMonth();}
  return true;}
const PERIOD_KO={all:'전체 기간',today:'오늘',week:'최근 7일',month:'이번 달'};
async function api(action,payload){const{data,error}=await SB.rpc('api',{action,payload:payload||{},token:TOKEN});if(error)throw error;return data;}
const ST={requested:['입금대기','p-req','req'],confirmed:['확정','p-con','con'],cancelled:['취소','p-can','can']};
const WD=['일','월','화','수','목','금','토'],DAY_KO=['주중','금','토','공휴일'],SEAS=[['off','비수기',''],['mid','준성수기','#0F87FF'],['high','성수기','#FF0000']];
function fdate(s){if(!s)return'';const d=new Date(s+'T00:00');return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}(${WD[d.getDay()]})`;}
function fday(x){const d=new Date(x);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

async function login(){
  const u=el('u').value.trim(),p=el('p').value;el('loginMsg').textContent='';
  if(!u||!p){el('loginMsg').textContent='아이디와 비밀번호를 입력하세요.';return;}
  const b=el('loginBtn');b.disabled=true;b.textContent='로그인 중…';
  try{const{data,error}=await SB.rpc('api',{action:'login',payload:{username:u,password:p}});
    if(error)throw error;
    if(data&&data.ok){TOKEN=data.token;localStorage.setItem('gs_admin_token',TOKEN);enterDash();}
    else{el('loginMsg').textContent=(data&&data.error)||'로그인 실패';b.disabled=false;b.textContent='로그인';}
  }catch(e){el('loginMsg').textContent='로그인 중 오류가 발생했습니다.';b.disabled=false;b.textContent='로그인';}
}
function logout(){TOKEN=null;localStorage.removeItem('gs_admin_token');el('dashView').classList.add('hidden');el('loginView').classList.remove('hidden');const b=el('loginBtn');b.disabled=false;b.textContent='로그인';el('p').value='';}
async function enterDash(){el('loginView').classList.add('hidden');el('dashView').classList.remove('hidden');el('who').textContent='admin 님';el('today').textContent=fday(new Date());await loadAll();}
async function loadAll(){
  try{ALL=await api('admin.reservations')||[];}catch(e){logout();return;}
  if(ALL&&ALL.ok===false){logout();return;}
  try{CFG=await api('admin.config');}catch(e){CFG=null;}
  try{PHOTOS=await api('photos')||{};}catch(e){PHOTOS={};}
  renderView();
}
function setView(v){VIEW=v;document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  el('viewList').classList.toggle('hidden',v!=='list');el('viewCal').classList.toggle('hidden',v!=='cal');el('viewSettings').classList.toggle('hidden',v!=='settings');el('viewStats').classList.toggle('hidden',v!=='stats');
  el('ptitle').textContent=v==='list'?'예약 현황':v==='cal'?'예약 캘린더':v==='stats'?'매출 통계':'요금·객실 설정';renderView();}
function renderView(){if(VIEW==='list')renderList();else if(VIEW==='cal')renderCal();else if(VIEW==='stats')renderStats();else renderSettings();}
/* ===== 매출 통계 ===== */
function renderStats(){
  const conf=ALL.filter(r=>r.status==='confirmed'&&r.source!=='block');
  const now=new Date();const months=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);}
  const mSales={},mCnt={};months.forEach(m=>{mSales[m]=0;mCnt[m]=0;});
  conf.forEach(r=>{const m=(r.checkin||'').slice(0,7);if(m in mSales){mSales[m]+=r.total_price;mCnt[m]++;}});
  const maxM=Math.max(1,...months.map(m=>mSales[m]));
  const totalSales=conf.reduce((s,r)=>s+r.total_price,0);
  const totalNights=conf.reduce((s,r)=>s+(r.nights||0),0);
  const avg=conf.length?Math.round(totalSales/conf.length):0;
  // by room
  const rooms=(CFG&&CFG.rooms||[]);
  const byRoom={};conf.forEach(r=>{byRoom[r.room_id]=byRoom[r.room_id]||{cnt:0,sales:0};byRoom[r.room_id].cnt++;byRoom[r.room_id].sales+=r.total_price;});
  const roomIds=Object.keys(byRoom).sort((a,b)=>byRoom[b].sales-byRoom[a].sales);
  const maxR=Math.max(1,...roomIds.map(k=>byRoom[k].sales));
  // this-year total
  const yr=now.getFullYear();const yrSales=conf.filter(r=>(r.checkin||'').slice(0,4)==String(yr)).reduce((s,r)=>s+r.total_price,0);
  el('viewStats').innerHTML=`
    <div class="tiles">
      <div class="tile sales"><div class="lab">확정 매출 (전체)</div><div class="v">${won(totalSales)}<small> 원</small></div></div>
      <div class="tile con"><div class="lab">확정 예약</div><div class="v">${conf.length}<small> 건</small></div></div>
      <div class="tile"><div class="lab">누적 숙박</div><div class="v">${totalNights}<small> 박</small></div></div>
      <div class="tile"><div class="lab">건당 평균</div><div class="v">${won(avg)}<small> 원</small></div></div>
      <div class="tile sales"><div class="lab">${yr}년 매출</div><div class="v">${won(yrSales)}<small> 원</small></div></div>
    </div>
    <div class="sec"><h3>월별 매출 (확정 · 체크인 기준)</h3><div class="d">최근 12개월</div>
      <div class="bars">${months.map(m=>`<div class="bar-row"><span class="bar-m">${m.slice(2).replace('-','.')}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(mSales[m]/maxM*100)}%"></div></div><span class="bar-v">${mSales[m]?won(mSales[m]):'-'}${mCnt[m]?` <em>(${mCnt[m]})</em>`:''}</span></div>`).join('')}</div>
    </div>
    <div class="sec"><h3>객실별 매출 (확정)</h3>
      <div class="bars">${roomIds.length?roomIds.map(k=>`<div class="bar-row"><span class="bar-m">${roomName(k)}</span><div class="bar-track"><div class="bar-fill r" style="width:${Math.round(byRoom[k].sales/maxR*100)}%"></div></div><span class="bar-v">${won(byRoom[k].sales)} <em>(${byRoom[k].cnt}건)</em></span></div>`).join(''):'<div class="d">확정 예약이 없습니다.</div>'}</div>
    </div>`;
}

/* ===== 예약 목록 ===== */
function counts(){const rows=ALL.filter(r=>r.source!=='block');const c={all:rows.length,requested:0,confirmed:0,cancelled:0};rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);return c;}
function renderList(){
  const c=counts();
  const today=todayStr();
  let sales=0,monthSales=0,upcoming=0;const now=new Date();const todayMid=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  ALL.forEach(r=>{if(r.source==='block')return;if(r.status==='confirmed'){sales+=r.total_price;const ci=new Date(r.checkin+'T00:00');if(ci.getFullYear()===now.getFullYear()&&ci.getMonth()===now.getMonth())monthSales+=r.total_price;if(ci>=todayMid)upcoming++;}});
  let rows=ALL.slice();
  if(FILTER!=='all')rows=rows.filter(r=>r.status===FILTER);
  rows=rows.filter(r=>periodMatch(r.created_at));
  if(Q){const q=Q.toLowerCase();rows=rows.filter(r=>(r.guest_name||'').toLowerCase().includes(q)||(r.guest_phone||'').includes(q)||(r.room_id||'').includes(q)||roomName(r.room_id).toLowerCase().includes(q));}
  const actBtns=r=>r.status==='cancelled'?'':(r.status==='requested'?`<button class="mini pri" onclick="event.stopPropagation();setStatus(${r.id},'confirmed')">입금확인</button> `:'')+`<button class="mini dang" onclick="event.stopPropagation();setStatus(${r.id},'cancelled')">취소</button>`;
  const body=rows.length?rows.map(r=>{const st=r.source==='block'?['판매중지','']:(ST[r.status]||[r.status,'']);const a=actBtns(r);
    return `<tr onclick="openDetail(${r.id})" style="cursor:pointer">
      <td><span class="pill ${st[1]}">${st[0]}</span></td>
      <td><b>${roomName(r.room_id)}</b></td>
      <td class="sched"><b>${fdate(r.checkin)} → ${fdate(r.checkout)}</b><span>${r.nights}박</span></td>
      <td class="guest"><b>${r.guest_name||''}</b><a href="tel:${(r.guest_phone||'').replace(/[^0-9]/g,'')}" onclick="event.stopPropagation()">${r.guest_phone||''}</a></td>
      <td class="num">${r.guests||'-'}명</td>
      <td class="amt">${won(r.total_price)}<span style="font-size:.72em;color:var(--faint)"> 원</span></td>
      <td class="applied">${fday(r.created_at)}</td>
      <td><div class="acts">${a||'<span class=dash>—</span>'}</div></td></tr>`;}).join(''):`<tr><td colspan="8"><div class="state"><b>${ALL.length?'결과가 없습니다':'아직 예약이 없습니다'}</b>${ALL.length?'필터·검색·기간을 바꿔보세요.':'홈페이지 예약이 접수되면 여기 표시됩니다.'}</div></td></tr>`;
  const cards=rows.map(r=>{const st=r.source==='block'?['판매중지','']:(ST[r.status]||[r.status,'']);const a=actBtns(r);
    return `<div class="rcard" onclick="openDetail(${r.id})" style="cursor:pointer"><div class="h"><span class="pill ${st[1]}">${st[0]}</span><b class="amt">${won(r.total_price)} 원</b></div>
      <dl><dt>객실</dt><dd>${roomName(r.room_id)}</dd><dt>일정</dt><dd>${fdate(r.checkin)}→${fdate(r.checkout)} ${r.nights}박</dd><dt>예약자</dt><dd>${r.guest_name||''} (${r.guests||'-'}명)</dd><dt>연락처</dt><dd><a href="tel:${(r.guest_phone||'').replace(/[^0-9]/g,'')}" onclick="event.stopPropagation()" style="color:var(--moss)">${r.guest_phone||''}</a></dd></dl>
      <div class="acts" style="margin-top:10px">${a||'-'}</div></div>`;}).join('');
  el('viewList').innerHTML=`
    <div class="tiles">
      <div class="tile"><div class="lab">전체 예약</div><div class="v">${c.all}<small> 건</small></div></div>
      <div class="tile req"><div class="lab">입금 대기</div><div class="v">${c.requested}<small> 건</small></div></div>
      <div class="tile con"><div class="lab">다가오는 예약</div><div class="v">${upcoming}<small> 건</small></div></div>
      <div class="tile sales"><div class="lab">이번달 매출</div><div class="v">${won(monthSales)}<small> 원</small></div></div>
      <div class="tile sales"><div class="lab">누적 확정매출</div><div class="v">${won(sales)}<small> 원</small></div></div>
    </div>
    <div class="toolbar">
      <div class="chips" id="chips">
        <button data-f="all" class="${FILTER==='all'?'active':''}">전체 <span class="c">${c.all}</span></button>
        <button data-f="requested" class="${FILTER==='requested'?'active':''}">입금대기 <span class="c">${c.requested}</span></button>
        <button data-f="confirmed" class="${FILTER==='confirmed'?'active':''}">확정 <span class="c">${c.confirmed}</span></button>
        <button data-f="cancelled" class="${FILTER==='cancelled'?'active':''}">취소 <span class="c">${c.cancelled}</span></button>
      </div>
      <div class="chips" id="periods">
        ${['all','today','week','month'].map(p=>`<button data-p="${p}" class="${PERIOD===p?'active':''}">${PERIOD_KO[p]}</button>`).join('')}
      </div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="예약자·연락처·객실" value="${Q.replace(/"/g,'&quot;')}"></div>
      <button class="btn" id="blockBtn" style="margin-left:auto">날짜 막기</button>
      <button class="btn" id="addBtn">+ 수기 예약</button>
    </div>
    <div class="listmeta">표시 ${rows.length}건 · 행을 누르면 상세정보</div>
    <div class="card"><div class="tblscroll"><table>
      <thead><tr><th>상태</th><th>객실</th><th>일정</th><th>예약자 · 연락처</th><th>인원</th><th class="r">금액</th><th>신청일</th><th></th></tr></thead>
      <tbody>${body}</tbody></table></div><div class="cards">${cards}</div></div>`;
  el('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(b){FILTER=b.dataset.f;renderList();}});
  el('periods').addEventListener('click',e=>{const b=e.target.closest('button');if(b){PERIOD=b.dataset.p;renderList();}});
  el('q').addEventListener('input',e=>{Q=e.target.value.trim();const p=e.target.selectionStart;renderList();const nq=el('q');nq.focus();try{nq.setSelectionRange(p,p);}catch(_){}});
  el('addBtn').addEventListener('click',openAddModal);
  el('blockBtn').addEventListener('click',openBlockModal);
}
window.openDetail=function(id){
  const r=ALL.find(x=>x.id===id);if(!r)return;const st=r.source==='block'?['판매중지','']:(ST[r.status]||[r.status,'']);
  const phone=(r.guest_phone||'').replace(/[^0-9]/g,'');
  const created=new Date(r.created_at);const cstr=`${fday(r.created_at)} ${String(created.getHours()).padStart(2,'0')}:${String(created.getMinutes()).padStart(2,'0')}`;
  const row=(k,v)=>`<div class="dtl-row"><span class="dtl-k">${k}</span><span class="dtl-v">${v}</span></div>`;

function renderCal(){
  const y=calRef.getFullYear(),m=calRef.getMonth();
  const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();
  const todayStr=fday(new Date());
  const active=ALL.filter(r=>r.status!=='cancelled');
  let cells='';
  for(let i=0;i<start;i++)cells+='<div class="cell empty"></div>';
  for(let dd=1;dd<=days;dd++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const list=active.filter(r=>r.checkin<=ds&&ds<r.checkout);
    const chips=list.slice(0,4).map(r=>`<div class="rvchip ${ST[r.status]?ST[r.status][2]:''}" title="${r.room_id} ${r.guest_name}">${r.room_id} ${r.guest_name||''}</div>`).join('')+(list.length>4?`<div style="font-size:.68rem;color:var(--faint)">+${list.length-4}</div>`:'');
    cells+=`<div class="cell"><span class="dnum${fday(new Date(y,m,dd))===todayStr?' today':''}">${dd}</span>${chips}</div>`;
  }
  el('viewCal').innerHTML=`
    <div class="calbar"><button id="pm">‹</button><b>${y}.${String(m+1).padStart(2,'0')}</b><button id="nm">›</button>
      <span style="margin-left:12px;font-size:.8rem;color:var(--faint)"><span class="rvchip con" style="padding:.1em .5em">확정</span> <span class="rvchip req" style="padding:.1em .5em">입금대기</span> · 숙박일 기준</span></div>
    <div class="card" style="padding:12px">
      <div class="cal">${WD.map((w,i)=>`<div class="wd ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}${cells}</div>
    </div>`;
  el('pm').onclick=()=>{calRef=new Date(y,m-1,1);renderCal();};
  el('nm').onclick=()=>{calRef=new Date(y,m+1,1);renderCal();};
}

function gsResize(file){return new Promise((res,rej)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(url);
    const MAX=1400;let{width:w,height:h}=img;
    if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',0.82));
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('이미지를 읽지 못했습니다'));};
  img.src=url;
});}
window.uploadPhoto=async function(slot,input){
  const file=input.files&&input.files[0];if(!file)return;
  if(!/^image\//.test(file.type)){toast('이미지 파일만 올릴 수 있습니다');return;}
  toast('사진 처리 중…');
  try{
    let uri=await gsResize(file);
    if(uri.length>1500000){uri=await new Promise(r=>{const i=new Image();i.onload=()=>{const MAX=1000;let w=i.width,h=i.height;if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);r(c.toDataURL('image/jpeg',0.75));};i.src=uri;});}
    const res=await api('admin.set_photo',{slot,data_uri:uri});
    if(res&&res.ok){PHOTOS[slot]=uri;renderSettings();toast('사진이 교체되었습니다');}
    else{toast((res&&res.error)||'저장 실패');}
  }catch(e){toast('사진 처리 오류');}
};

  if(!confirm('이 사진을 기본 사진으로 되돌릴까요?'))return;
  try{const res=await api('admin.del_photo',{slot});if(res&&res.ok){delete PHOTOS[slot];renderSettings();toast('기본 사진으로 되돌렸습니다');}else{toast('실패');}}catch(e){toast('오류가 발생했습니다');}

  const items={};document.querySelectorAll('.setf').forEach(i=>{items[i.dataset.k]=i.value.trim();});
  try{const r=await api('admin.set_settings',{items});if(r&&r.ok===false){toast(r.error||'실패');return;}CFG=await api('admin.config');toast('기본 정보 저장 완료');}catch(e){toast('저장 오류');}};

/* ===== 추가 옵션 편집 ===== */
function optListHTML(){const opts=(CFG&&CFG.options)||[];if(!opts.length)return '<div style="color:var(--faint);font-size:.85rem;padding:6px 0">등록된 옵션이 없습니다.</div>';
  return opts.map(o=>`<div class="optrow" data-id="${o.id}">
    <input type="text" class="o-name" value="${(o.name||'').replace(/"/g,'&quot;')}" placeholder="옵션명">
    <input type="text" class="o-unit" value="${(o.unit||'').replace(/"/g,'&quot;')}" placeholder="단위" style="max-width:90px">
    <div class="pcell" style="max-width:130px"><input type="text" inputmode="numeric" class="pinp o-price" value="${won(o.price)}"><span class="wsuffix">원</span></div>
    <label class="rchk"><input type="checkbox" class="o-active" ${o.active?'checked':''}> 사용</label>
    <button class="mini pri" onclick="saveOption('${o.id}')">저장</button>
    <button class="mini" onclick="delOption('${o.id}')">삭제</button>
  </div>`).join('');}
window.saveOption=async function(id){const row=document.querySelector(`.optrow[data-id="${id}"]`);if(!row)return;
  const payload={id,name:row.querySelector('.o-name').value.trim(),unit:row.querySelector('.o-unit').value.trim(),price:parseInt(String(row.querySelector('.o-price').value).replace(/[^0-9]/g,''))||0,active:row.querySelector('.o-active').checked};
  try{const r=await api('admin.set_option',payload);if(r&&r.ok===false){toast(r.error||'실패');return;}CFG=await api('admin.config');renderSettings();toast('옵션 저장 완료');}catch(e){toast('옵션 저장 오류');}};
window.addOption=async function(){const name=el('noName').value.trim();if(!name){toast('옵션명을 입력하세요');return;}
  const payload={name,unit:el('noUnit').value.trim(),price:parseInt(String(el('noPrice').value).replace(/[^0-9]/g,''))||0,active:true};
  try{const r=await api('admin.set_option',payload);if(r&&r.ok===false){toast(r.error||'실패');return;}CFG=await api('admin.config');renderSettings();toast('옵션 추가 완료');}catch(e){toast('옵션 추가 오류');}};
window.delOption=async function(id){if(!confirm('이 옵션을 삭제할까요? (기존 예약 기록은 그대로 유지됩니다)'))return;
  try{const r=await api('admin.del_option',{id});if(r&&r.ok===false){toast(r.error||'실패');return;}CFG=await api('admin.config');renderSettings();toast('옵션 삭제 완료');}catch(e){toast('옵션 삭제 오류');}};

/* ===== 공휴일 편집 ===== */
function holListHTML(){const hs=(CFG&&CFG.holidays)||[];if(!hs.length)return '<div style="color:var(--faint);font-size:.85rem;padding:6px 0">등록된 공휴일이 없습니다.</div>';
  return hs.map(h=>{const d=(typeof h==='string')?h:h.d;const lb=(typeof h==='string')?'':(h.label||'');
    return `<span class="holchip">${d}${lb?` · ${lb}`:''} <span class="x" onclick="delHoliday('${d}')">✕</span></span>`;}).join('');}
window.addHoliday=async function(){const d=el('nhDate').value;if(!d){toast('날짜를 선택하세요');return;}
  try{const r=await api('admin.set_holiday',{d,label:el('nhLabel').value.trim()});if(r&&r.ok===false){toast(r.error||'실패');return;}CFG=await api('admin.config');renderSettings();toast('공휴일 추가 완료');}catch(e){toast('공휴일 추가 오류');}};
window.delHoliday=async function(d){if(!confirm(d+' 공휴일을 삭제할까요?'))return;
  try{const r=await api('admin.del_holiday',{d});if(r&&r.ok===false){toast(r.error||'실패');return;}CFG=await api('admin.config');renderSettings();toast('공휴일 삭제 완료');}catch(e){toast('공휴일 삭제 오류');}};

/* ===== 수기 예약 모달 ===== */
function openAddModal(){
  const rooms=(CFG&&CFG.rooms)||[];
  const t=new Date();t.setHours(0,0,0,0);const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const ci=iso(t),co=iso(new Date(t.getTime()+864e5));
  el('modalHost').innerHTML=`<div class="ov" id="ov"><div class="modal">
    <h3>수기 예약 등록</h3>
    <div class="fld"><label>객실</label><select id="mRoom">${rooms.map(r=>`<option value="${r.id}">${r.name} (기준 ${r.cap_base}/최대 ${r.cap_max})</option>`).join('')}</select></div>
    <div class="row2"><div class="fld"><label>체크인</label><input type="date" id="mCi" value="${ci}"></div><div class="fld"><label>체크아웃</label><input type="date" id="mCo" value="${co}"></div></div>
    <div class="row2"><div class="fld"><label>예약자</label><input type="text" id="mName" placeholder="성함"></div><div class="fld"><label>연락처</label><input type="tel" id="mPhone" placeholder="010-"></div></div>
    <div class="row2"><div class="fld"><label>인원</label><input type="number" id="mGuests" value="2" min="1"></div><div class="fld"><label>상태</label><select id="mStatus"><option value="confirmed">확정(입금완료)</option><option value="requested">입금대기</option></select></div></div>
    <div class="fld"><label>메모(선택)</label><input type="text" id="mMemo" placeholder="예: 전화예약, 요청사항"></div>
    <div class="msg" id="mMsg" style="color:var(--sub)"></div>
    <div class="foot"><button class="btn line" id="mCancel">취소</button><button class="btn" id="mSave">등록</button></div>
  </div></div>`;
  el('ov').addEventListener('click',e=>{if(e.target.id==='ov')el('modalHost').innerHTML='';});
  el('mCancel').onclick=()=>el('modalHost').innerHTML='';
  el('mSave').onclick=async()=>{
    const name=el('mName').value.trim(),phone=el('mPhone').value.trim();
    if(!name||!phone){el('mMsg').innerHTML='<span style="color:var(--can)">성함·연락처를 입력하세요.</span>';return;}
    const b=el('mSave');b.disabled=true;b.textContent='등록 중…';
    try{const r=await api('admin.add_reservation',{room_id:el('mRoom').value,checkin:el('mCi').value,checkout:el('mCo').value,guest_name:name,guest_phone:phone,guests:parseInt(el('mGuests').value)||2,status:el('mStatus').value,memo:el('mMemo').value.trim()});
      if(r&&r.ok){el('modalHost').innerHTML='';toast('수기 예약 등록 완료 ('+won(r.total)+'원)');await loadAll();}
      else{el('mMsg').innerHTML='<span style="color:var(--can)">'+((r&&r.error)||'등록 실패')+'</span>';b.disabled=false;b.textContent='등록';}
    }catch(e){el('mMsg').innerHTML='<span style="color:var(--can)">오류가 발생했습니다.</span>';b.disabled=false;b.textContent='등록';}
  };
}

/* ===== 예약 수정 ===== */
window.openEditModal=function(id){
  const r=ALL.find(x=>x.id===id);if(!r)return;
  const rooms=(CFG&&CFG.rooms)||[];
  el('modalHost').innerHTML=`<div class="ov" id="ov"><div class="modal">
    <h3>예약 수정 #${r.id}</h3>
    <div class="fld"><label>객실</label><select id="eRoom">${rooms.map(x=>`<option value="${x.id}" ${x.id===r.room_id?'selected':''}>${x.name}</option>`).join('')}</select></div>
    <div class="row2"><div class="fld"><label>체크인</label><input type="date" id="eCi" value="${r.checkin}"></div><div class="fld"><label>체크아웃</label><input type="date" id="eCo" value="${r.checkout}"></div></div>
    <div class="row2"><div class="fld"><label>예약자</label><input type="text" id="eName" value="${(r.guest_name||'').replace(/"/g,'&quot;')}"></div><div class="fld"><label>연락처</label><input type="tel" id="ePhone" value="${(r.guest_phone||'').replace(/"/g,'&quot;')}"></div></div>
    <div class="row2"><div class="fld"><label>인원</label><input type="number" id="eGuests" value="${r.guests||2}" min="1"></div><div class="fld"><label>결제금액(원)</label><input type="text" inputmode="numeric" class="pinp" id="ePrice" value="${won(r.total_price)}"></div></div>
    <div class="row2"><div class="fld"><label>상태</label><select id="eStatus"><option value="confirmed" ${r.status==='confirmed'?'selected':''}>확정</option><option value="requested" ${r.status==='requested'?'selected':''}>입금대기</option><option value="cancelled" ${r.status==='cancelled'?'selected':''}>취소</option></select></div><div class="fld"><label> </label><div style="font-size:.8rem;color:var(--faint);padding-top:10px">날짜·객실 변경 시 중복은 자동 검사되지 않으니 캘린더로 확인하세요</div></div></div>
    <div class="fld"><label>메모</label><input type="text" id="eMemo" value="${(r.memo||'').replace(/"/g,'&quot;')}" placeholder="요청사항·옵션·이메일 등"></div>
    <div class="msg" id="eMsg" style="color:var(--sub)"></div>
    <div class="foot"><button class="btn line" id="eCancel">닫기</button><button class="btn" id="eSave">저장</button></div>
  </div></div>`;
  el('ov').addEventListener('click',e=>{if(e.target.id==='ov')el('modalHost').innerHTML='';});
  el('eCancel').onclick=()=>el('modalHost').innerHTML='';
  el('eSave').onclick=async()=>{
    const b=el('eSave');b.disabled=true;b.textContent='저장 중…';
    try{const res=await api('admin.update_reservation',{id:r.id,room_id:el('eRoom').value,checkin:el('eCi').value,checkout:el('eCo').value,guest_name:el('eName').value.trim(),guest_phone:el('ePhone').value.trim(),guests:parseInt(el('eGuests').value)||null,total_price:parseInt(String(el('ePrice').value).replace(/[^0-9]/g,''))||0,status:el('eStatus').value,memo:el('eMemo').value});
      if(res&&res.ok){el('modalHost').innerHTML='';toast('예약 수정 완료');await loadAll();}
      else{el('eMsg').innerHTML='<span style="color:var(--can)">'+((res&&res.error)||'저장 실패')+'</span>';b.disabled=false;b.textContent='저장';}
    }catch(e){el('eMsg').innerHTML='<span style="color:var(--can)">오류가 발생했습니다.</span>';b.disabled=false;b.textContent='저장';}
  };
};
window.deleteReservation=async function(id){
  if(!confirm('예약 #'+id+' 을(를) 완전히 삭제할까요?\n삭제하면 되돌릴 수 없습니다. (단순 취소는 "예약 취소"를 쓰세요)'))return;
  try{const r=await api('admin.delete_reservation',{id});if(r&&r.ok===false){toast(r.error||'실패');return;}el('modalHost').innerHTML='';toast('삭제했습니다');await loadAll();}catch(e){toast('오류가 발생했습니다');}
};
/* ===== 날짜 막기(판매중지) ===== */
function openBlockModal(){
  const rooms=(CFG&&CFG.rooms)||[];
  const t=new Date();t.setHours(0,0,0,0);const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const ci=iso(t),co=iso(new Date(t.getTime()+864e5));
  el('modalHost').innerHTML=`<div class="ov" id="ov"><div class="modal">
    <h3>날짜 막기 (판매중지)</h3>
    <div style="font-size:.85rem;color:var(--sub);margin-bottom:10px">선택한 객실·기간을 온라인 예약에서 잠급니다. (정비·개인사용·전화선점 등)</div>
    <div class="fld"><label>객실</label><select id="bRoom">${rooms.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div>
    <div class="row2"><div class="fld"><label>시작일</label><input type="date" id="bCi" value="${ci}"></div><div class="fld"><label>종료일(체크아웃)</label><input type="date" id="bCo" value="${co}"></div></div>
    <div class="fld"><label>사유(선택)</label><input type="text" id="bLabel" placeholder="예: 정비, 개인사용, 전화예약 선점"></div>
    <div class="msg" id="bMsg" style="color:var(--sub)"></div>
    <div class="foot"><button class="btn line" id="bCancel">취소</button><button class="btn" id="bSave">막기</button></div>
  </div></div>`;
  el('ov').addEventListener('click',e=>{if(e.target.id==='ov')el('modalHost').innerHTML='';});
  el('bCancel').onclick=()=>el('modalHost').innerHTML='';
  el('bSave').onclick=async()=>{
    const b=el('bSave');b.disabled=true;b.textContent='처리 중…';
    try{const res=await api('admin.add_block',{room_id:el('bRoom').value,checkin:el('bCi').value,checkout:el('bCo').value,label:el('bLabel').value.trim()||'판매중지'});
      if(res&&res.ok){el('modalHost').innerHTML='';toast('해당 기간을 막았습니다');await loadAll();}
      else{el('bMsg').innerHTML='<span style="color:var(--can)">'+((res&&res.error)||'실패')+'</span>';b.disabled=false;b.textContent='막기';}
    }catch(e){el('bMsg').innerHTML='<span style="color:var(--can)">오류가 발생했습니다.</span>';b.disabled=false;b.textContent='막기';}
  };
}

el('loginBtn').addEventListener('click',login);
el('p').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
el('u').addEventListener('keydown',e=>{if(e.key==='Enter')el('p').focus();});
el('refreshBtn').addEventListener('click',()=>{loadAll();toast('새로고침했습니다');});
el('logoutBtn').addEventListener('click',logout);
el('vtabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v);});
// 요금 입력 콤마 자동 표시
document.addEventListener('input',e=>{if(e.target&&e.target.classList&&e.target.classList.contains('pinp')){const digits=e.target.value.replace(/[^0-9]/g,'');e.target.value=digits?Number(digits).toLocaleString('ko-KR'):'';}});
if(TOKEN)enterDash();
