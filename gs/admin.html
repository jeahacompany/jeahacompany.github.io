<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>히든밸리 펜션 · 예약 관리자</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#eef0e8; --panel:#fbfcf8; --panel2:#f5f7ef; --ink:#1a221c; --sub:#5c6558; --faint:#8a9384;
  --forest:#2c4a34; --forest-d:#213a29; --moss:#5f8352; --clay:#b5793f; --line:#e0e3d8; --line2:#eceee6;
  --shadow:0 1px 2px rgba(28,44,32,.04), 0 12px 30px -18px rgba(28,44,32,.28);
  --req:#a6791a; --req-bg:#fbf1d7; --con:#2f6b3f; --con-bg:#e0efe1; --can:#a24a3d; --can-bg:#f6e3de;
  --serif:"Gowun Batang",serif; --sans:"IBM Plex Sans KR",sans-serif; --mono:"IBM Plex Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#12160f; --panel:#191f16; --panel2:#161b13; --ink:#eef1e6; --sub:#a7b09c; --faint:#7c8672;
  --forest:#9cc48e; --forest-d:#8bb47d; --moss:#a6c495; --clay:#d69a5f; --line:#2a3325; --line2:#212a1d;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.7);
  --req:#e0b45a; --req-bg:#33290f; --con:#9ed3a6; --con-bg:#1e3320; --can:#e79a8c; --can-bg:#3a231e;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);margin:0;letter-spacing:-.01em}
.mono,.num{font-variant-numeric:tabular-nums}
button{font-family:var(--sans);cursor:pointer}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--forest);color:#eef2e8}
.top .in{max-width:1160px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
.logo{display:flex;flex-direction:column;line-height:1.1}
.logo b{font-family:var(--serif);font-size:1.12rem;color:#fff}
.logo span{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:#b7cfa9}
.top .spacer{flex:1}
.top .who{font-size:.82rem;color:#c3d5b7;margin-right:4px}
.tbtn{background:rgba(255,255,255,.10);color:#eef2e8;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:.45em .85em;font-size:.85rem;font-weight:500;transition:.15s}
.tbtn:hover{background:rgba(255,255,255,.2)}

.wrap{max-width:1160px;margin:0 auto;padding:26px 22px 60px}

/* login */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:38px 34px}
.login .brandmk{text-align:center;margin-bottom:24px}
.login .brandmk b{font-family:var(--serif);font-size:1.35rem;display:block}
.login .brandmk span{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--moss)}
.login h2{font-size:1.15rem;margin-bottom:4px}
.login .hint{color:var(--sub);font-size:.85rem;margin-bottom:22px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:.76rem;font-weight:600;color:var(--sub);letter-spacing:.02em}
.fld input,.fld select{font-family:var(--sans);font-size:.98rem;padding:.7em .85em;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);width:100%;transition:.15s}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 3px color-mix(in srgb,var(--moss) 22%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font-weight:600;font-size:.92rem;padding:.72em 1.1em;border-radius:10px;border:1px solid transparent;background:var(--forest);color:#fff;transition:.15s;width:100%}
.btn:hover{background:var(--forest-d)}
.btn:disabled{opacity:.55;cursor:default}
.msg{font-size:.85rem;margin-top:12px;min-height:1.1em}
.msg.err{color:var(--can)}

/* section head */
.phead{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.phead h1{font-size:1.6rem}
.phead .date{color:var(--faint);font-size:.85rem;margin-left:auto;font-family:var(--mono)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--moss)}
.tile.req::before{background:var(--req)}.tile.con::before{background:var(--con)}.tile.can::before{background:var(--can)}.tile.sales::before{background:var(--clay)}
.tile .lab{font-size:.76rem;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--serif);font-size:1.9rem;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:.95rem;color:var(--sub);font-weight:400;font-family:var(--sans)}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}.tile.sales{grid-column:span 2}}
@media(max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tile.sales{grid-column:span 2}}

/* toolbar */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.tabs button{border:none;background:transparent;color:var(--sub);font-size:.86rem;font-weight:600;padding:.5em .9em;border-radius:8px;transition:.15s;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.active{background:var(--panel);color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tabs button .c{font-family:var(--mono);font-size:.78em;opacity:.7;margin-left:3px}
.search{position:relative;margin-left:auto;flex:1;max-width:280px;min-width:180px}
.search input{width:100%;padding:.6em .85em .6em 2.2em;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-family:var(--sans);font-size:.9rem}
.search input:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 3px color-mix(in srgb,var(--moss) 20%,transparent)}
.search svg{position:absolute;left:.7em;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint)}

/* table */
.tablecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tblscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:840px}
thead th{background:var(--panel2);color:var(--sub);font-weight:600;font-size:.76rem;letter-spacing:.02em;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.r{text-align:right}
tbody td{padding:13px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--panel2)}
.rid{font-family:var(--mono);color:var(--faint);font-size:.8rem}
.room-c b{font-weight:600}
.room-c span{display:block;font-size:.76rem;color:var(--faint)}
.sched b{font-weight:600;font-variant-numeric:tabular-nums}
.sched span{display:block;font-size:.76rem;color:var(--faint)}
.guest b{font-weight:600}
.guest a{display:block;font-size:.8rem;color:var(--moss);text-decoration:none;font-variant-numeric:tabular-nums}
.guest a:hover{text-decoration:underline}
.amt{font-family:var(--serif);font-size:1.02rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.applied{color:var(--faint);font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:.28em .7em;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-req{background:var(--req-bg);color:var(--req)}.p-con{background:var(--con-bg);color:var(--con)}.p-can{background:var(--can-bg);color:var(--can)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.mini{font-size:.8rem;font-weight:600;padding:.4em .7em;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:.15s;white-space:nowrap}
.mini:hover{border-color:var(--faint)}
.mini.pri{background:var(--con);border-color:var(--con);color:#fff}
.mini.pri:hover{filter:brightness(.94)}
.mini.dang{color:var(--can);border-color:color-mix(in srgb,var(--can) 40%,var(--line))}
.mini.dang:hover{background:var(--can-bg)}
.dash{color:var(--faint)}

/* states */
.state{padding:56px 20px;text-align:center;color:var(--sub)}
.state svg{width:40px;height:40px;stroke:var(--faint);margin-bottom:12px}
.state b{display:block;font-family:var(--serif);font-size:1.1rem;color:var(--ink);margin-bottom:4px}
.skel{height:52px;border-bottom:1px solid var(--line2);background:linear-gradient(90deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:.7em 1.2em;border-radius:10px;font-size:.88rem;font-weight:500;box-shadow:var(--shadow);transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* mobile cards */
.cards{display:none;flex-direction:column;gap:12px;padding:12px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--panel)}
.rcard .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rcard .rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.86rem}
.rcard .rows dt{color:var(--faint);font-weight:500}
.rcard .rows dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.rcard .acts{margin-top:12px}
@media(max-width:760px){.tblscroll{display:none}.cards{display:flex}}

.foot{margin-top:26px;text-align:center;color:var(--faint);font-size:.78rem}
</style>
</head>
<body>

<!-- ===== 로그인 ===== -->
<div id="loginView" class="login-shell">
  <div class="login">
    <div class="brandmk"><b>히든밸리 펜션</b><span>Hidden Valley</span></div>
    <h2>예약 관리자</h2>
    <div class="hint">예약 확인·입금 처리 페이지입니다.</div>
    <div class="fld"><label for="u">아이디</label><input id="u" autocomplete="username" placeholder="admin"></div>
    <div class="fld"><label for="p">비밀번호</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••"></div>
    <button class="btn" id="loginBtn">로그인</button>
    <div class="msg err" id="loginMsg"></div>
  </div>
</div>

<!-- ===== 대시보드 ===== -->
<div id="dashView" class="hidden">
  <div class="top"><div class="in">
    <div class="logo"><b>히든밸리 펜션</b><span>Admin · 예약관리</span></div>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="tbtn" id="refreshBtn">↻ 새로고침</button>
    <button class="tbtn" id="logoutBtn">로그아웃</button>
  </div></div>

  <div class="wrap">
    <div class="phead">
      <h1>예약 현황</h1>
      <span class="date" id="today"></span>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button data-f="all" class="active">전체 <span class="c" id="c-all">0</span></button>
        <button data-f="requested">입금대기 <span class="c" id="c-req">0</span></button>
        <button data-f="confirmed">확정 <span class="c" id="c-con">0</span></button>
        <button data-f="cancelled">취소 <span class="c" id="c-can">0</span></button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="예약자·연락처·객실 검색">
      </div>
    </div>

    <div class="tablecard" id="tableCard"></div>
    <div class="foot">히든밸리 펜션 예약관리 · 도반글로벌</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB=supabase.createClient('https://epxjjvowhlxaksviyhus.supabase.co','sb_publishable_VMd564QhmwzjRtmeMgklgg_pQaamR1M');
const el=id=>document.getElementById(id);
const won=n=>Number(n||0).toLocaleString('ko-KR');
let TOKEN=localStorage.getItem('gs_admin_token')||null;
let ALL=[], FILTER='all', Q='';
async function api(action,payload){const{data,error}=await SB.rpc('api',{action,payload:payload||{},token:TOKEN});if(error)throw error;return data;}
const ST={requested:['입금대기','p-req'],confirmed:['확정','p-con'],cancelled:['취소','p-can']};
const WD=['일','월','화','수','목','금','토'];
function fdate(s){if(!s)return'';const d=new Date(s+'T00:00');return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}(${WD[d.getDay()]})`;}
function fday(s){if(!s)return'';const d=new Date(s);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

async function login(){
  const u=el('u').value.trim(), p=el('p').value; el('loginMsg').textContent='';
  if(!u||!p){el('loginMsg').textContent='아이디와 비밀번호를 입력하세요.';return;}
  const b=el('loginBtn'); b.disabled=true; b.textContent='로그인 중…';
  try{
    const {data,error}=await SB.rpc('api',{action:'login',payload:{username:u,password:p}});
    if(error) throw error;
    if(data&&data.ok){ TOKEN=data.token; localStorage.setItem('gs_admin_token',TOKEN); enterDash(); }
    else { el('loginMsg').textContent=(data&&data.error)||'로그인에 실패했습니다.'; b.disabled=false; b.textContent='로그인'; }
  }catch(e){ el('loginMsg').textContent='로그인 중 오류가 발생했습니다.'; b.disabled=false; b.textContent='로그인'; }
}
function logout(){TOKEN=null;localStorage.removeItem('gs_admin_token');el('dashView').classList.add('hidden');el('loginView').classList.remove('hidden');const b=el('loginBtn');b.disabled=false;b.textContent='로그인';el('p').value='';}

function enterDash(){
  el('loginView').classList.add('hidden'); el('dashView').classList.remove('hidden');
  el('who').textContent='admin 님'; el('today').textContent=fday(new Date());
  loadList();
}
function skeleton(){el('tableCard').innerHTML='<div class="tblscroll"><table><tbody>'+Array(4).fill('<tr><td colspan="8"><div class="skel"></div></td></tr>').join('')+'</tbody></table></div>';}

async function loadList(){
  skeleton();
  let rows;
  try{ rows=await api('admin.reservations'); }
  catch(e){ el('tableCard').innerHTML=stateHTML('불러오기 실패','다시 로그인해 주세요.'); return; }
  if(rows&&rows.ok===false){ logout(); return; }
  ALL=rows||[]; render();
}

function counts(){const c={all:ALL.length,requested:0,confirmed:0,cancelled:0};ALL.forEach(r=>c[r.status]=(c[r.status]||0)+1);return c;}
function renderTiles(){
  const c=counts(); let sales=0,pending=0;
  ALL.forEach(r=>{if(r.status==='confirmed')sales+=r.total_price; if(r.status==='requested')pending+=r.total_price;});
  el('tiles').innerHTML=`
    <div class="tile"><div class="lab">전체 예약</div><div class="v">${c.all}<small> 건</small></div></div>
    <div class="tile req"><div class="lab">입금 대기</div><div class="v">${c.requested}<small> 건</small></div></div>
    <div class="tile con"><div class="lab">확정</div><div class="v">${c.confirmed}<small> 건</small></div></div>
    <div class="tile can"><div class="lab">취소</div><div class="v">${c.cancelled}<small> 건</small></div></div>
    <div class="tile sales"><div class="lab">확정 매출</div><div class="v">${won(sales)}<small> 원</small></div></div>`;
  el('c-all').textContent=c.all; el('c-req').textContent=c.requested; el('c-con').textContent=c.confirmed; el('c-can').textContent=c.cancelled;
}
function stateHTML(title,desc){return `<div class="state"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><b>${title}</b>${desc||''}</div>`;}

function actionsHTML(r){
  if(r.status==='cancelled') return '<span class="dash">—</span>';
  let h='';
  if(r.status==='requested') h+=`<button class="mini pri" onclick="setStatus(${r.id},'confirmed')">입금확인</button>`;
  h+=`<button class="mini dang" onclick="setStatus(${r.id},'cancelled')">취소</button>`;
  return h;
}
function render(){
  renderTiles();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.f===FILTER));
  let rows=ALL.slice();
  if(FILTER!=='all') rows=rows.filter(r=>r.status===FILTER);
  if(Q){const q=Q.toLowerCase();rows=rows.filter(r=>(r.guest_name||'').toLowerCase().includes(q)||(r.guest_phone||'').includes(q)||(r.room_id||'').toLowerCase().includes(q));}
  if(!ALL.length){el('tableCard').innerHTML=stateHTML('아직 예약이 없습니다','홈페이지에서 예약이 접수되면 여기에 표시됩니다.');return;}
  if(!rows.length){el('tableCard').innerHTML=stateHTML('결과가 없습니다','필터나 검색어를 바꿔보세요.');return;}
  const body=rows.map(r=>{const st=ST[r.status]||[r.status,''];return `<tr>
      <td><span class="pill ${st[1]}">${st[0]}</span></td>
      <td class="room-c"><b>${r.room_id}</b></td>
      <td class="sched"><b>${fdate(r.checkin)} → ${fdate(r.checkout)}</b><span>${r.nights}박</span></td>
      <td class="guest"><b>${r.guest_name||''}</b><a href="tel:${(r.guest_phone||'').replace(/[^0-9]/g,'')}">${r.guest_phone||''}</a></td>
      <td class="num">${r.guests||'-'}명</td>
      <td class="amt">${won(r.total_price)}<span style="font-size:.72em;color:var(--faint)"> 원</span></td>
      <td class="applied">${fday(r.created_at)}</td>
      <td><div class="acts">${actionsHTML(r)}</div></td>
    </tr>`;}).join('');
  const cards=rows.map(r=>{const st=ST[r.status]||[r.status,''];return `<div class="rcard">
      <div class="h"><span class="pill ${st[1]}">${st[0]}</span><b class="amt">${won(r.total_price)} 원</b></div>
      <dl class="rows">
        <dt>객실</dt><dd>${r.room_id}</dd>
        <dt>일정</dt><dd>${fdate(r.checkin)} → ${fdate(r.checkout)} · ${r.nights}박</dd>
        <dt>예약자</dt><dd>${r.guest_name||''} (${r.guests||'-'}명)</dd>
        <dt>연락처</dt><dd><a href="tel:${(r.guest_phone||'').replace(/[^0-9]/g,'')}" style="color:var(--moss)">${r.guest_phone||''}</a></dd>
        <dt>신청일</dt><dd>${fday(r.created_at)}</dd>
      </dl>
      <div class="acts">${actionsHTML(r)}</div>
    </div>`;}).join('');
  el('tableCard').innerHTML=`
    <div class="tblscroll"><table>
      <thead><tr><th>상태</th><th>객실</th><th>일정</th><th>예약자 · 연락처</th><th>인원</th><th class="r">금액</th><th>신청일</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <div class="cards">${cards}</div>`;
}

async function setStatus(id,status){
  const label=status==='confirmed'?'입금확인(확정)':'취소';
  if(!confirm(`예약 #${id} 을(를) "${label}" 처리할까요?`)) return;
  try{ const r=await api('admin.set_status',{id,status}); if(r&&r.ok===false){toast(r.error||'처리 실패');return;}
    toast(status==='confirmed'?'입금 확인 → 확정 처리했습니다':'예약을 취소했습니다'); await loadList(); }
  catch(e){ toast('처리 중 오류가 발생했습니다'); }
}
window.setStatus=setStatus;

el('loginBtn').addEventListener('click',login);
el('p').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
el('u').addEventListener('keydown',e=>{if(e.key==='Enter')el('p').focus();});
el('refreshBtn').addEventListener('click',()=>{loadList();toast('새로고침했습니다');});
el('logoutBtn').addEventListener('click',logout);
el('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;FILTER=b.dataset.f;render();});
el('q').addEventListener('input',e=>{Q=e.target.value.trim();render();});
if(TOKEN) enterDash();
</script>
