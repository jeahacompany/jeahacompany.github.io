<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공지사항 · 소식 | 히든벨리 펜션</title>
<meta name="description" content="히든벨리 펜션(구 원효계곡펜션) 공지사항·소식 — 고객 사진과 계절의 변화를 전합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--forest:#12805a;--forest-d:#0c6647;--moss:#17a06a;--ink:#20302a;--sub:#5c6b63;--paper:#faf7f0;--line:#e4ded0;--clay:#d9544d}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{overflow-x:clip;max-width:100%;width:100%}
  body{font-family:"Noto Sans KR",sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
  .serif{font-family:"Nanum Myeongjo",serif}
  a{color:inherit}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:50;background:rgba(250,247,240,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:74px;max-width:1180px;margin:0 auto;padding:0 20px}
  .brand{display:flex;flex-direction:column;line-height:1.05;text-decoration:none}
  .brand b{font-family:"Nanum Myeongjo",serif;font-size:1.5rem}
  .brand .sub{font-size:.72rem;font-weight:500;color:var(--sub);letter-spacing:0;margin-top:3px}
  .brand .sub em{color:var(--moss);font-weight:700;letter-spacing:.15em;text-transform:uppercase;font-style:normal}
  .navlinks{display:flex;gap:24px;font-size:1.05rem;font-weight:600}
  .navlinks a{text-decoration:none;color:var(--ink)}.navlinks a:hover{color:var(--forest)}
  .navlinks a.on{color:var(--forest)}
  @media(max-width:700px){.navlinks{gap:16px;font-size:.95rem}.navlinks a.hideM{display:none}}
  .hero{background:linear-gradient(160deg,#0c6647,#17a06a);color:#fff;padding:54px 0 48px;text-align:center}
  .hero .ey{font-size:.82rem;letter-spacing:.3em;text-transform:uppercase;color:#bfe6d4;font-weight:700}
  .hero h1{font-size:clamp(2rem,6vw,2.9rem);margin-top:10px}
  .hero p{color:#dbefe4;margin-top:12px;font-size:1.02rem}
  main{padding:40px 0 70px}
  .posts{display:flex;flex-direction:column;gap:26px}
  .post{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px -22px rgba(0,0,0,.3)}
  .post .pbody{padding:24px 26px}
  .post .ptop{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .post .pin{font-size:.72rem;font-weight:700;color:#fff;background:var(--clay);border-radius:999px;padding:2px 10px}
  .post .pdate{font-size:.86rem;color:var(--sub)}
  .post h2{font-family:"Nanum Myeongjo",serif;font-size:1.5rem;margin-bottom:10px}
  .post .ptext{white-space:pre-wrap;color:#33423a;font-size:1.02rem;line-height:1.75}
  .pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:16px}
  .pgal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--line)}
  .pgal.one{grid-template-columns:1fr}.pgal.one img{aspect-ratio:16/9;max-height:460px}
  .empty{text-align:center;color:var(--sub);padding:70px 20px;font-size:1.05rem}
  .back{display:inline-flex;align-items:center;gap:6px;margin-top:34px;color:var(--forest);font-weight:600;text-decoration:none}
  footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--sub);font-size:.86rem}
  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200;cursor:zoom-out}
  #lb img{max-width:94vw;max-height:92vh;border-radius:8px}
</style></head>
<body>
<header>
  <div class="nav">
    <a href="index.html" class="brand"><b>히든벨리 펜션</b><span class="sub"><em>Hidden Valley</em> · 구 원효계곡펜션</span></a>
    <nav class="navlinks">
      <a href="index.html" class="hideM">홈</a>
      <a href="index.html#rooms" class="hideM">객실</a>
      <a href="notice.html" class="on">공지사항</a>
      <a href="index.html#book">예약</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="ey">NOTICE &amp; NEWS</div>
    <h1 class="serif">공지사항 · 소식</h1>
    <p>히든벨리의 계절 이야기와 다녀가신 분들의 순간을 전합니다.</p>
  </div>
</section>

<main>
  <div class="wrap">
    <div class="posts" id="posts"><div class="empty">불러오는 중…</div></div>
    <div style="text-align:center"><a href="index.html" class="back">← 홈으로 돌아가기</a></div>
  </div>
</main>

<footer>© 히든벨리 펜션 (구 원효계곡펜션) · 히든벨리 2026</footer>

<div id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB=supabase.createClient('https://epxjjvowhlxaksviyhus.supabase.co','sb_publishable_VMd564QhmwzjRtmeMgklgg_pQaamR1M');
async function api(action,payload){const{data,error}=await SB.rpc('api',{action,payload:payload||{}});if(error)throw error;return data;}
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fdate=d=>{if(!d)return '';try{var x=new Date(d);if(isNaN(x))return d;return x.getFullYear()+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+String(x.getDate()).padStart(2,'0');}catch(_){return d;}};
window.zoom=function(src){document.getElementById('lbimg').src=src;document.getElementById('lb').style.display='flex';};
(async function(){
  var box=document.getElementById('posts');
  var list=[];
  try{var s=await api('settings');var raw=s&&s.notices_json; if(raw){list=JSON.parse(raw)||[];}}catch(e){list=[];}
  if(!Array.isArray(list)||!list.length){box.innerHTML='<div class="empty">아직 등록된 공지사항이 없습니다.<br>곧 히든벨리의 소식으로 찾아뵙겠습니다 🌿</div>';return;}
  list.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0) || String(b.date||'').localeCompare(String(a.date||''));});
  box.innerHTML=list.map(function(p){
    var imgs=(p.images||[]).filter(Boolean);
    var gal=imgs.length?('<div class="pgal'+(imgs.length===1?' one':'')+'">'+imgs.map(function(u){return '<img src="'+u+'" loading="lazy" onclick="zoom(this.src)" alt="">';}).join('')+'</div>'):'';
    return '<article class="post"><div class="pbody">'+
      '<div class="ptop">'+(p.pinned?'<span class="pin">공지</span>':'')+'<span class="pdate">'+esc(fdate(p.date))+'</span></div>'+
      '<h2>'+esc(p.title||'(제목 없음)')+'</h2>'+
      (p.body?'<div class="ptext">'+esc(p.body)+'</div>':'')+
      gal+'</div></article>';
  }).join('');
})();
</script>
</body></html>
