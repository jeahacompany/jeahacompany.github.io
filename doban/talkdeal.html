<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카카오 톡딜 현황판</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--tx:#e6e8ee;--dim:#8b93a5;--y:#fee500;--up:#4ade80;--dn:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{padding:7px 13px;border:1px solid var(--line);border-radius:20px;cursor:pointer;font-size:13px;background:var(--card);user-select:none}
.tab.on{background:var(--y);color:#111;border-color:var(--y);font-weight:700}
input.q,select.q{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:7px 11px;font-size:13px;min-width:160px}
input.q::placeholder{color:var(--dim)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--dim)}
.filters label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.filters input[type=checkbox]{accent-color:var(--y)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#1f232b;text-align:left;padding:9px 10px;font-size:12px;color:var(--dim);white-space:nowrap;z-index:1}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}th.on{color:var(--y)}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nm{min-width:220px}
.nm a{color:var(--tx);text-decoration:none}
.nm a:hover{color:var(--y)}
.st{color:var(--dim);font-size:11px;margin-top:2px}
.up{color:var(--up);font-weight:700}
.badge{display:inline-block;padding:1px 6px;border-radius:5px;background:#2a2f3a;font-size:11px;color:var(--dim);margin-left:5px}
.badge.ad{background:#3b2f00;color:var(--y)}
.badge.food{background:#143a22;color:var(--up)}
.badge.small{background:#1d2a44;color:#8fb4ff}
.score{display:inline-block;min-width:34px;text-align:center;padding:2px 6px;border-radius:6px;background:#2a2f3a;font-weight:700}
.score.hi{background:var(--y);color:#111}
.score.mid{background:#3b3a1a;color:var(--y)}
.scroll{max-height:76vh;overflow:auto}
.note{color:var(--dim);font-size:13px;padding:18px;line-height:1.8}
.err{color:var(--dn)}
.tablewrap{overflow-x:auto}
.help{color:var(--dim);font-size:12px;padding:8px 12px;border-top:1px solid var(--line);line-height:1.7}
@media(max-width:640px){.wrap{padding:12px}td,th{padding:8px 7px;font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>카카오 톡딜 현황판</h1>
  <div class="sub" id="sub">불러오는 중…</div>
  <div class="bar">
    <div class="tabs">
      <div class="tab on" data-t="src">소싱 후보</div>
      <div class="tab" data-t="win">오늘의 승자</div>
      <div class="tab" data-t="gmv">누적 판매 TOP</div>
      <div class="tab" data-t="hot">지금 뜨는 딜</div>
      <div class="tab" data-t="brand">브랜드 랭킹</div>
      <div class="tab" data-t="cat">카테고리 벤치마크</div>
      <div class="tab" data-t="ad">광고 지면</div>
      <div class="tab" data-t="end">마감 임박</div>
    </div>
    <input class="q" id="q" placeholder="상품·브랜드·카테고리 검색">
  </div>
  <div class="filters" id="filters">
    <label><input type="checkbox" id="fFood" checked> 식품만</label>
    <label><input type="checkbox" id="fSmall"> 소형 판매자만 (딜 3개 이하)</label>
    <label>기간
      <select class="q" id="fDays" style="min-width:90px">
        <option value="7">7일</option><option value="3">3일</option><option value="14">14일</option><option value="30">30일</option>
      </select>
    </label>
    <label>가격대
      <select class="q" id="fPrice" style="min-width:120px">
        <option value="">전체</option><option value="0-10000">1만원 미만</option><option value="10000-20000">1~2만원</option>
        <option value="20000-40000">2~4만원</option><option value="40000-">4만원 이상</option>
      </select>
    </label>
    <a id="csv" href="#" style="color:var(--dim);font-size:12px;margin-left:auto">CSV 내려받기</a>
  </div>
  <div class="card">
    <div class="scroll tablewrap" id="body"><div class="note">불러오는 중…</div></div>
    <div class="help" id="help"></div>
  </div>
</div>

<script>
const SB  = "https://bgkdkfmdndhqgfdygmfm.supabase.co/rest/v1/rpc/";
const KEY = "sb_publishable_KxsYIOy5d4i7TR5PVBExLg_8UvNz6v9";

const rpc = (fn, args) => fetch(SB + fn, {
  method: "POST",
  headers: { apikey: KEY, "Content-Type": "application/json" },
  body: JSON.stringify(args || {})
}).then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(fn + ": " + t); }));

const n   = v => (Number(v) || 0).toLocaleString("ko-KR");
const won = v => n(v) + "원";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 서버는 UTC로 내려주므로 보는 사람 시간대로 바꿔서 표시한다
const fmt = t => t
  ? new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
  : "-";
const fmtD = t => t ? new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric" }) : "-";

let D = { feed: [], movers: [], brands: [], cats: [], ads: [], src: [] };
let tab = "src", q = "", srcDays = 7;
let sort = { key: "pick_score", dir: -1 };

const hit = o => {
  if (!q) return true;
  const s = q.toLowerCase();
  return ((o.product_name || "") + " " + (o.store_name || "") + " " + (o.category_name || "")).toLowerCase().includes(s);
};

const nameCell = it => '<td class="nm"><a href="' + esc(it.url || "#") + '" target="_blank" rel="noopener">'
  + esc(it.product_name) + "</a>"
  + (it.placement_key ? '<span class="badge ad">광고 ' + esc(it.placement_key) + "</span>" : "")
  + '<div class="st">' + esc(it.store_name) + (it.category_name ? " · " + esc(it.category_name) : "") + "</div></td>";

const table = (head, rows) => rows.length
  ? "<table><thead><tr>" + head + "</tr></thead><tbody>" + rows.join("") + "</tbody></table>"
  : '<div class="note">해당하는 항목이 없다.</div>';

// 평점 = 긍정평가(%). 없으면(옛 데이터) 표시하지 않는다
const rating = it => (it.positive_pct > 0 ? it.positive_pct + "%" : "-") + '<div class="st">' + n(it.review_count) + "개</div>";

const srcCols = [
  { k: "pick_score", h: "점수", n: 1 },
  { k: "name", h: "상품" },
  { k: "price", h: "톡딜가", n: 1 },
  { k: "sold", h: "기간 판매", n: 1 },
  { k: "sold_per_day", h: "하루 평균", n: 1 },
  { k: "est_revenue", h: "기간 추정매출", n: 1 },
  { k: "store_deals", h: "판매자 딜수", n: 1 },
  { k: "positive_pct", h: "긍정평가", n: 1 },
  { k: "days", h: "관찰", n: 1 },
  { k: "total_sale_count", h: "누적", n: 1 }
];

function srcRows() {
  const food = document.getElementById("fFood").checked;
  const small = document.getElementById("fSmall").checked;
  const pr = document.getElementById("fPrice").value;
  let lo = 0, hi = Infinity;
  if (pr) { const [a, b] = pr.split("-"); lo = Number(a) || 0; hi = b ? Number(b) : Infinity; }
  let w = D.src.filter(hit).filter(i => (!food || i.is_food) && (!small || i.store_deals <= 3) && i.price >= lo && i.price < hi);
  const k = sort.key;
  w.sort((a, b) => {
    const x = k === "name" ? (a.product_name || "") : Number(a[k]) || 0;
    const y = k === "name" ? (b.product_name || "") : Number(b[k]) || 0;
    return (x < y ? -1 : x > y ? 1 : 0) * sort.dir;
  });
  return w;
}

const views = {
  src() {
    if (!D.src.length) return '<div class="note">아직 소싱 후보를 계산할 데이터가 없다.<br>수집이 2일 이상 쌓이면 <b>기간 동안 실제로 몇 개 팔렸나(누적판매 증가) ÷ 일수</b>로 후보가 뜬다.</div>';
    const w = srcRows();
    const head = srcCols.map(c => '<th class="s' + (c.n ? " n" : "") + (sort.key === c.k ? " on" : "") + '" data-k="' + c.k + '">'
      + c.h + (sort.key === c.k ? (sort.dir < 0 ? " ▼" : " ▲") : "") + "</th>").join("");
    return table(head, w.slice(0, 500).map(it => {
      const sc = it.pick_score || 0;
      return "<tr>"
        + '<td class="n"><span class="score' + (sc >= 70 ? " hi" : sc >= 50 ? " mid" : "") + '">' + sc + "</span></td>"
        + '<td class="nm"><a href="' + esc(it.url || "#") + '" target="_blank" rel="noopener">' + esc(it.product_name) + "</a>"
        + (it.is_food ? '<span class="badge food">식품</span>' : "")
        + (it.store_deals <= 3 ? '<span class="badge small">소형</span>' : "")
        + '<div class="st">' + esc(it.store_name) + (it.category_name ? " · " + esc(it.category_name) : "") + "</div></td>"
        + '<td class="n">' + won(it.price) + '<div class="st">' + Math.round(it.discount_rate || 0) + "%↓</div></td>"
        + '<td class="n up">+' + n(it.sold) + "</td>"
        + '<td class="n">' + n(Math.round(it.sold_per_day)) + "개</td>"
        + '<td class="n">' + won(it.est_revenue) + "</td>"
        + '<td class="n">' + n(it.store_deals) + "</td>"
        + '<td class="n">' + rating(it) + "</td>"
        + '<td class="n">' + it.days + "일<div class=\"st\">" + fmtD(it.from_at) + "~" + fmtD(it.to_at) + "</div></td>"
        + '<td class="n">' + n(it.total_sale_count) + "</td></tr>";
    }));
  },
  win() {
    // 24시간치가 쌓이기 전에는 직전 스냅샷 대비 증감으로 대체한다
    const src = D.movers.length ? D.movers
      : D.feed.filter(i => i.delta > 0)
              .map(i => Object.assign({}, i, { sold: i.delta }))
              .sort((a, b) => b.est_revenue - a.est_revenue);
    const w = src.filter(hit);
    if (!w.length) return '<div class="note">아직 증감 데이터가 없다.<br>스냅샷이 2회 이상 쌓이면 <b>직전 대비 몇 개 팔렸나 × 톡딜가 = 추정 매출</b>이 여기 뜬다.</div>';
    return table('<th class="n">#</th><th>상품</th><th class="n">톡딜가</th><th class="n">판매증가</th><th class="n">추정매출</th><th class="n">누적</th>',
      w.map((it, i) => '<tr><td class="n">' + (i + 1) + "</td>" + nameCell(it)
        + '<td class="n">' + won(it.price) + "</td>"
        + '<td class="n up">+' + n(it.sold) + "</td>"
        + '<td class="n up">' + won(it.est_revenue) + "</td>"
        + '<td class="n">' + n(it.total_sale_count) + "</td></tr>"));
  },
  gmv() {
    const w = D.feed.filter(hit).slice().sort((a, b) => b.gmv - a.gmv);
    return table('<th class="n">#</th><th>상품</th><th class="n">톡딜가</th><th class="n">누적판매</th><th class="n">누적매출(추정)</th><th class="n">주문중</th>',
      w.slice(0, 300).map((it, i) => '<tr><td class="n">' + (i + 1) + "</td>" + nameCell(it)
        + '<td class="n">' + won(it.price) + '<div class="st">' + Math.round(it.discount_rate || 0) + "%↓</div></td>"
        + '<td class="n">' + n(it.total_sale_count) + "</td>"
        + '<td class="n">' + won(it.gmv) + "</td>"
        + '<td class="n">' + n(it.group_user_count) + "</td></tr>"));
  },
  hot() {
    const w = D.feed.filter(hit).filter(i => i.rank_user < 9999).sort((a, b) => a.rank_user - b.rank_user);
    return table('<th class="n">구경순위</th><th>상품</th><th class="n">톡딜가</th><th class="n">주문중</th><th class="n">7일방문</th><th class="n">긍정평가</th>',
      w.slice(0, 300).map(it => '<tr><td class="n">' + it.rank_user + "</td>" + nameCell(it)
        + '<td class="n">' + won(it.price) + "</td>"
        + '<td class="n">' + n(it.group_user_count) + "</td>"
        + '<td class="n">' + n(it.uv_7d) + "</td>"
        + '<td class="n">' + rating(it) + "</td></tr>"));
  },
  brand() {
    const w = D.brands.filter(hit);
    return table('<th class="n">#</th><th>브랜드</th><th class="n">딜수</th><th class="n">누적판매</th><th class="n">누적매출(추정)</th><th class="n">주문중</th>',
      w.map((b, i) => '<tr><td class="n">' + (i + 1) + "</td><td>" + esc(b.store_name) + "</td>"
        + '<td class="n">' + n(b.deals) + "</td>"
        + '<td class="n">' + n(b.total_sale) + "</td>"
        + '<td class="n">' + won(b.gmv) + "</td>"
        + '<td class="n">' + n(b.users) + "</td></tr>"));
  },
  cat() {
    const w = D.cats.filter(hit);
    return table('<th class="n">#</th><th>카테고리</th><th class="n">딜수</th><th class="n">평균할인</th><th class="n">평균가</th><th class="n">누적매출(추정)</th>',
      w.map((c, i) => '<tr><td class="n">' + (i + 1) + "</td><td>" + esc(c.category_name) + "</td>"
        + '<td class="n">' + n(c.deals) + "</td>"
        + '<td class="n">' + (c.avg_rate || 0) + "%</td>"
        + '<td class="n">' + won(c.avg_price) + "</td>"
        + '<td class="n">' + won(c.gmv) + "</td></tr>"));
  },
  ad() {
    const w = D.ads.filter(hit);
    if (!w.length) return '<div class="note">아직 기록된 광고 지면이 없다.</div>';
    return table("<th>수집시각</th><th>지면</th><th>상품</th><th class=\"n\">톡딜가</th><th class=\"n\">누적판매</th><th class=\"n\">주문중</th>",
      w.map(it => "<tr><td>" + fmt(it.captured_at) + "</td><td>" + esc(it.placement_key) + "</td>"
        + nameCell(it)
        + '<td class="n">' + won(it.price) + "</td>"
        + '<td class="n">' + n(it.total_sale_count) + "</td>"
        + '<td class="n">' + n(it.group_user_count) + "</td></tr>"));
  },
  end() {
    const w = D.feed.filter(hit).filter(i => i.remain_days > 0).sort((a, b) => a.remain_days - b.remain_days);
    return table('<th class="n">남음</th><th>상품</th><th class="n">톡딜가</th><th class="n">누적판매</th><th class="n">주문중</th>',
      w.slice(0, 200).map(it => '<tr><td class="n">' + it.remain_days + "일</td>" + nameCell(it)
        + '<td class="n">' + won(it.price) + "</td>"
        + '<td class="n">' + n(it.total_sale_count) + "</td>"
        + '<td class="n">' + n(it.group_user_count) + "</td></tr>"));
  }
};

const HELP = {
  src: "점수(0~100) = 하루 판매속도 50 + 기간 추정매출 20 + 긍정평가 10 + 소형 판매자 10 + 관찰 3일 이상 10. "
     + "「기간 판매」는 그 기간 동안 누적판매가 실제로 늘어난 개수, 「판매자 딜수」가 적으면 큰 브랜드가 아닌 소형 판매자라 소싱 접촉이 쉽다. "
     + "상품명을 누르면 카카오 스토어 딜 페이지가 열린다.",
  win: "직전 수집 대비 누적판매 증가 × 톡딜가 = 추정 매출.",
  hot: "구경중 순위 = 카카오 전체 톡딜 랭킹(구경중순) 상위 2,000개 중 순위."
};

const draw = (keepScroll) => {
  const el = document.getElementById("body");
  const y = keepScroll ? el.scrollTop : 0;
  el.innerHTML = views[tab]();
  el.scrollTop = y;   // 자동 새로고침 때 보던 위치를 잃지 않게
  document.getElementById("filters").style.display = tab === "src" ? "" : "none";
  document.getElementById("help").textContent = HELP[tab] || "";
  document.getElementById("help").style.display = HELP[tab] ? "" : "none";
  el.querySelectorAll("th.s").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sort.key === k) sort.dir = -sort.dir; else sort = { key: k, dir: k === "name" ? 1 : -1 };
    draw(true);
  });
};

document.querySelectorAll(".tab").forEach(el => el.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  el.classList.add("on"); tab = el.dataset.t; draw();
});
document.getElementById("q").oninput = e => { q = e.target.value.trim(); draw(); };
["fFood", "fSmall", "fPrice"].forEach(id => document.getElementById(id).onchange = () => draw());
document.getElementById("fDays").onchange = async e => {
  srcDays = Number(e.target.value) || 7;
  try { D.src = await rpc("td_sourcing", { p_days: srcDays, p_limit: 1000 }) || []; } catch (err) { D.src = []; }
  draw();
};
document.getElementById("csv").onclick = e => {
  e.preventDefault();
  const w = srcRows();
  const cols = ["pick_score", "product_name", "store_name", "category_name", "price", "discount_rate", "sold", "days", "sold_per_day",
    "est_revenue", "store_deals", "positive_pct", "review_count", "total_sale_count", "url"];
  const csv = "﻿" + [cols.join(",")].concat(w.map(r => cols.map(c => {
    const v = r[c] == null ? "" : String(r[c]);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(","))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "톡딜_소싱후보_" + srcDays + "일.csv"; a.click();
};

const ago = t => {
  if (!t) return "";
  const m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return m + "분 전";
  const h = Math.floor(m / 60);
  return h < 24 ? h + "시간 " + (m % 60) + "분 전" : Math.floor(h / 24) + "일 전";
};

const load = async () => {
  try {
    const [feed, movers, brands, cats, ads, src, latest] = await Promise.all([
      rpc("td_feed",   { p_limit: 1000 }),
      rpc("td_movers", { p_hours: 24, p_limit: 300 }),
      rpc("td_brands", { p_limit: 100 }),
      rpc("td_cats",   { p_limit: 60 }),
      rpc("td_ads",    { p_days: 14 }),
      rpc("td_sourcing", { p_days: srcDays, p_limit: 1000 }),
      rpc("td_latest", {})
    ]);
    D = { feed: feed || [], movers: movers || [], brands: brands || [], cats: cats || [], ads: ads || [], src: src || [] };
    const cap = latest || D.feed.reduce((a, b) => (!a || b.captured_at > a ? b.captured_at : a), null);
    document.getElementById("sub").textContent =
      "최근 수집 " + ago(cap) + " (" + fmt(cap) + ") · 추적 딜 " + n(D.feed.length) + "개"
      + " · 회사 서버가 30분마다 수집(전체 랭킹은 하루 4회)";
    draw(true);
  } catch (e) {
    document.getElementById("sub").innerHTML = '<span class="err">불러오기 실패</span>';
    document.getElementById("body").innerHTML = '<div class="note err">' + esc(e.message) + "</div>";
  }
};

load();
// 화면을 켜둔 채로도 최신이 되게 3분마다 다시 읽는다
setInterval(load, 180000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
