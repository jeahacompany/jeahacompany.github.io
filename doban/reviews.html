<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도반 리뷰 현황</title>
<style>
  :root {
    --ground:#F4F7F5; --card:#FFFFFF; --ink:#18231D; --ink-2:#51605A; --ink-3:#8A968F;
    --line:#E3E9E4; --line-2:#EFF3F0; --accent:#0B7A45; --accent-soft:#E4F2EA;
    --warn:#A9690F; --warn-soft:#FBF0DC; --bad:#AE3325; --bad-soft:#FAE8E5; --kakao:#FEE500;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#111713; --card:#1A231E; --ink:#E7EDE9; --ink-2:#A6B3AB; --ink-3:#6D7A73;
      --line:#293530; --line-2:#212B26; --accent:#4CC38A; --accent-soft:#1C3227;
      --warn:#D8A244; --warn-soft:#332810; --bad:#E4705F; --bad-soft:#38201C; }
  }
  :root[data-theme="dark"] { --ground:#111713; --card:#1A231E; --ink:#E7EDE9; --ink-2:#A6B3AB;
    --ink-3:#6D7A73; --line:#293530; --line-2:#212B26; --accent:#4CC38A; --accent-soft:#1C3227;
    --warn:#D8A244; --warn-soft:#332810; --bad:#E4705F; --bad-soft:#38201C; }
  :root[data-theme="light"] { --ground:#F4F7F5; --card:#FFFFFF; --ink:#18231D; --ink-2:#51605A;
    --ink-3:#8A968F; --line:#E3E9E4; --line-2:#EFF3F0; --accent:#0B7A45; --accent-soft:#E4F2EA;
    --warn:#A9690F; --warn-soft:#FBF0DC; --bad:#AE3325; --bad-soft:#FAE8E5; }

  * { box-sizing:border-box; }
  html { background:var(--ground); }
  body { font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    color:var(--ink); background:var(--ground); margin:0; padding:22px 16px 56px; line-height:1.6;
    -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:680px; margin:0 auto; }

  .eyebrow { font-size:11.5px; letter-spacing:.14em; color:var(--accent); font-weight:800; }
  h1 { font-size:22px; margin:3px 0 0; letter-spacing:-.01em; }
  .sub { color:var(--ink-2); font-size:13px; margin-top:3px; }
  header { margin-bottom:18px; }

  /* ── 매장 목록 ── */
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:12px;
    width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 14px;
    transition:border-color .12s, transform .12s; }
  .row:hover { border-color:var(--accent); }
  .row:active { transform:scale(.995); }
  .row:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row .nm { font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .row .meta { font-size:12px; color:var(--ink-3); margin-top:1px; display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .row .sc { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; text-align:right; line-height:1.2; }
  .row .sc small { display:block; font-size:11px; font-weight:500; color:var(--ink-3); }
  .row .arrow { color:var(--ink-3); font-size:18px; }

  .chip { font-size:11px; font-weight:800; border-radius:6px; padding:1px 7px; letter-spacing:.01em; }
  .chip.warn { background:var(--warn-soft); color:var(--warn); }
  .chip.new  { background:var(--line-2); color:var(--ink-2); }
  .chip.k    { background:var(--kakao); color:#3B1E1E; }
  .chip.bad  { background:var(--bad-soft); color:var(--bad); }

  /* ── 상세 ── */
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .back { display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color:var(--accent); font:inherit; font-weight:700; font-size:13.5px; cursor:pointer;
    padding:6px 0; }
  .back:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .copy { display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:13px; font-weight:700;
    color:#fff; background:var(--accent); border:none; border-radius:9px; padding:8px 14px; cursor:pointer;
    transition:opacity .12s; }
  .copy:hover { opacity:.88; }
  .copy:active { transform:scale(.97); }
  .copy:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .acts { display:inline-flex; align-items:center; gap:8px; }
  .copy2 { font:inherit; font-size:12.5px; font-weight:700; color:var(--ink-2);
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:7px 11px; cursor:pointer; }
  .copy2:hover { border-color:var(--ink-3); }
  .copy2:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:var(--ground); font-size:13.5px; font-weight:700;
    padding:11px 18px; border-radius:99px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:50; }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .plat { font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--ink-3); margin:16px 0 7px; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 13px; }
  .tile .l { font-size:11.5px; color:var(--ink-2); display:flex; gap:5px; align-items:baseline; flex-wrap:wrap; }
  .tile .v { font-size:25px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px; letter-spacing:-.02em; }
  .tile .u { font-size:12.5px; color:var(--ink-3); font-weight:500; }
  .tile .d { font-size:11.5px; color:var(--accent); font-weight:800; }
  .kbox { display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:13px; color:var(--ink-2);
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kbox .sep { color:var(--ink-3); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 14px 8px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--ink-2); font-size:11.5px; font-weight:700; padding:9px 6px; border-bottom:1px solid var(--line); }
  th:not(:first-child), td:not(:first-child) { text-align:right; }
  td { padding:9px 6px; border-bottom:1px solid var(--line-2); font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  .up { color:var(--accent); font-weight:700; }
  .down { color:var(--bad); font-weight:700; }
  .zero { color:var(--ink-3); }
  .sm { font-size:11px; }

  /* 별점 분포 · 주별 추이 */
  .bars { display:flex; flex-direction:column; gap:7px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:14px; }
  .bar { display:grid; grid-template-columns:62px 1fr 84px; align-items:center; gap:10px; font-size:12.5px; }
  .bar .t { color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bar .track { display:block; background:var(--line-2); border-radius:99px; height:15px; overflow:hidden; }
  .bar .fill { display:block; height:100%; border-radius:99px; background:var(--accent); }
  .bar .n { color:var(--ink-3); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* 부정 리뷰 */
  .rev { border:1px solid var(--line); border-left:3px solid var(--warn); background:var(--card);
    border-radius:10px; padding:11px 13px; }
  .rev.bad { border-left-color:var(--bad); background:var(--bad-soft); }
  .rev .hd { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px; }
  .rev .st { font-size:12px; font-weight:800; }
  .rev .dt { font-size:11.5px; color:var(--ink-3); }
  .rev p { margin:0; font-size:13px; color:var(--ink-2); }
  .rev.bad p { color:var(--ink); }
  .revs { display:flex; flex-direction:column; gap:8px; }
  .clean { background:var(--accent-soft); color:var(--accent); border-radius:12px; padding:13px 15px;
    font-size:13.5px; font-weight:700; }
  .err { background:var(--bad-soft); color:var(--bad); border-radius:12px; padding:14px 16px; font-size:14px; }
  .loading { color:var(--ink-3); font-size:14px; padding:28px; text-align:center; }
  .note { font-size:12px; color:var(--ink-3); margin-top:18px; }
  @media (max-width:430px) {
    .tiles { grid-template-columns:1fr 1fr; }
    .tiles .tile:first-child { grid-column:1 / -1; }
    .row .sc { font-size:18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">도반글로벌 · 리뷰 모니터링</div>
    <h1 id="title">매장 리뷰 현황</h1>
    <div class="sub" id="sub">불러오는 중...</div>
  </header>
  <div id="app"><div class="loading">데이터를 불러오는 중입니다...</div></div>
  <p class="note" id="note"></p>
</div>
<script>
const URL_RPC = "https://bgkdkfmdndhqgfdygmfm.supabase.co/rest/v1/rpc/review_feed";
const URL_DIG = "https://bgkdkfmdndhqgfdygmfm.supabase.co/rest/v1/rpc/review_digest_all";
const KEY = "sb_publishable_KxsYIOy5d4i7TR5PVBExLg_8UvNz6v9";
let DIGEST = {};
const p2 = n => String(n).padStart(2,"0");
const WD = ["일","월","화","수","목","금","토"];
const dayKey = iso => { const d=new Date(iso); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); };
const fmtDay = iso => { const d=new Date(iso); return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"; };
const fmtTime = iso => { const d=new Date(iso); return (d.getMonth()+1)+"/"+d.getDate()+" "+p2(d.getHours())+":"+p2(d.getMinutes()); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasK = k => k && k.score !== null && k.score !== "" && Number(k.score) > 0;

let MODEL = [], LATEST = null;

function build(rows) {
  const by = {};
  for (const r of rows) {
    const s = by[r.store_name] || (by[r.store_name] = { name:r.store_name, naver:[], kakao:null });
    if (r.platform === "kakao") {
      if (!s.kakao || s.kakao.checked_at < r.checked_at) s.kakao = r;
    } else s.naver.push(r);
    if (!LATEST || r.checked_at > LATEST) LATEST = r.checked_at;
  }
  MODEL = Object.values(by).filter(s => s.naver.length).map(s => {
    s.naver.sort((a,b) => a.checked_at < b.checked_at ? -1 : 1);
    const days = {};
    for (const r of s.naver) days[dayKey(r.checked_at)] = r;
    s.days = days;
    s.dayKeys = Object.keys(days).sort();
    s.last = days[s.dayKeys[s.dayKeys.length-1]];
    s.first = days[s.dayKeys[0]];
    s.dScore = +(s.last.score - s.first.score).toFixed(2);
    s.dVisit = s.last.visitor_cnt - s.first.visitor_cnt;
    s.dBlog  = s.last.blog_cnt - s.first.blog_cnt;
    s.cid = s.last.cid;
    return s;
  }).sort((a,b) => (b.last.visitor_cnt||0) - (a.last.visitor_cnt||0));
}

function renderList() {
  document.getElementById("title").textContent = "매장 리뷰 현황";
  document.getElementById("sub").textContent =
    MODEL.length + "개 매장 · 마지막 수집 " + fmtTime(LATEST);
  document.getElementById("note").innerHTML =
    "매장을 누르면 날짜별 변화를 볼 수 있습니다 · 네이버 + 카카오맵 공개 데이터 기준";

  let html = '<div class="list">';
  MODEL.forEach((s, i) => {
    const sc = Number(s.last.score);
    const chips = [];
    if (!s.last.visitor_cnt || s.last.visitor_cnt === 0) chips.push('<span class="chip new">리뷰 없음</span>');
    else if (sc > 0 && sc < 4.0) chips.push('<span class="chip warn">평점 확인</span>');
    if (hasK(s.kakao) && Number(s.kakao.score) < 4.0) chips.push('<span class="chip warn">카카오 ' + Number(s.kakao.score).toFixed(1) + '</span>');
    else if (hasK(s.kakao)) chips.push('<span class="chip k">카카오 ' + Number(s.kakao.score).toFixed(1) + '</span>');
    const dg = DIGEST[s.cid];
    if (dg && dg.lows && dg.lows.length) chips.push('<span class="chip bad">부정 ' + dg.lows.length + '건</span>');

    html += '<button class="row" data-i="' + i + '">'
      + '<span><span class="nm">' + esc(s.name) + '</span>'
      + '<span class="meta">방문자 리뷰 ' + s.last.visitor_cnt + '개'
      + (s.dVisit > 0 ? ' <span class="up">▲' + s.dVisit + '</span>' : '')
      + (chips.length ? ' ' + chips.join(' ') : '') + '</span></span>'
      + '<span class="sc">' + (sc > 0 ? sc.toFixed(2) : '–') + '<small>네이버 평점</small></span>'
      + '<span class="arrow">›</span></button>';
  });
  html += '</div>';
  document.getElementById("app").innerHTML = html;
  document.querySelectorAll(".row").forEach(b =>
    b.addEventListener("click", () => { location.hash = "s=" + encodeURIComponent(MODEL[+b.dataset.i].name); }));
}

function renderDetail(name) {
  const s = MODEL.find(x => x.name === name);
  if (!s) { location.hash = ""; return; }
  document.getElementById("title").textContent = s.name;
  document.getElementById("sub").textContent = "마지막 수집 " + fmtTime(s.last.checked_at);

  // 날짜별 변화 + 전일 대비 증감
  let trs = "";
  const keys = s.dayKeys;
  const start = Math.max(0, keys.length - 30);
  for (let i = keys.length - 1; i >= start; i--) {
    const r = s.days[keys[i]];
    const pv = i > 0 ? s.days[keys[i-1]] : null;
    const dv = pv ? r.visitor_cnt - pv.visitor_cnt : null;
    const db = pv ? r.blog_cnt - pv.blog_cnt : null;
    const ds = pv ? +(r.score - pv.score).toFixed(2) : null;
    const chg = dv === null ? '<span class="zero">·</span>'
      : dv > 0 ? '<span class="up">+' + dv + '</span>'
      : dv < 0 ? '<span class="down">' + dv + '</span>'
      : '<span class="zero">·</span>';
    trs += "<tr><td>" + fmtDay(r.checked_at) + "</td>"
      + "<td>" + (Number(r.score) > 0 ? Number(r.score).toFixed(2) : "–")
      + (ds > 0 ? ' <span class="up sm">▲' + ds.toFixed(2) + '</span>' : ds < 0 ? ' <span class="down sm">▼' + Math.abs(ds).toFixed(2) + '</span>' : '')
      + "</td><td>" + r.visitor_cnt + "</td><td>" + chg + "</td>"
      + "<td>" + r.blog_cnt + (db > 0 ? ' <span class="up sm">+' + db + '</span>' : '') + "</td></tr>";
  }
  const sc = Number(s.last.score);
  const kb = s.kakao
    ? '<div class="plat">카카오맵</div><div class="kbox"><span class="chip k">카카오맵</span><span>'
        + (hasK(s.kakao) ? Number(s.kakao.score).toFixed(1) + '점 · 리뷰 ' + s.kakao.visitor_cnt + '개'
                         : '리뷰 없음')
        + '</span><span class="sep">·</span><span>블로그 리뷰 ' + s.kakao.blog_cnt + '개</span></div>'
    : '';

  const dg = DIGEST[s.cid] || null;

  // 별점 분포
  let distHtml = "";
  if (dg && dg.total > 0) {
    const d = dg.dist, tot = dg.total;
    const rows = [["5점", d.five, "var(--accent)"], ["4점대", d.four, "var(--accent)"],
                  ["3점대", d.three, "var(--warn)"], ["2점 이하", d.low, "var(--bad)"]];
    distHtml = '<div class="plat">별점 분포 <span style="color:var(--ink-3);font-weight:600">'
      + '최근 리뷰 ' + tot + '건' + (dg.avg ? ' · 평균 ' + dg.avg + '점' : '') + '</span></div><div class="bars">'
      + rows.map(([lb, n, col]) => '<div class="bar"><span class="t">' + lb + '</span>'
          + '<span class="track"><span class="fill" style="width:' + Math.round((n||0)/tot*100) + '%;background:' + col + '"></span></span>'
          + '<span class="n">' + (n||0) + '건</span></div>').join('')
      + '</div>';
  }

  // 주별 리뷰 추이
  let wkHtml = "";
  if (dg && dg.weeks && dg.weeks.length) {
    const wks = dg.weeks.slice().reverse();
    const mx = Math.max(...wks.map(w => w.cnt));
    wkHtml = '<div class="plat">주별 리뷰 수와 평균 별점</div><div class="bars">'
      + wks.map(w => '<div class="bar"><span class="t">' + w.wk + ' 주</span>'
          + '<span class="track"><span class="fill" style="width:' + Math.round(w.cnt/mx*100) + '%"></span></span>'
          + '<span class="n">' + w.cnt + '건 · ' + (w.avg ?? '-') + '점</span></div>').join('')
      + '</div>';
  }

  // 악성 · 부정 리뷰
  let lowHtml = "";
  if (dg && dg.total > 0) {
    const lows = dg.lows || [];
    if (!lows.length) {
      lowHtml = '<div class="plat">부정 리뷰</div>'
        + '<div class="clean">✓ 최근 리뷰 ' + dg.total + '건 중 3점 이하 없음 — 깨끗합니다</div>';
    } else {
      lowHtml = '<div class="plat">부정 리뷰 <span style="color:var(--bad);font-weight:800">'
        + lows.length + '건</span></div><div class="revs">'
        + lows.map(r => {
            const rt = Number(r.rating);
            return '<div class="rev' + (rt <= 2 ? ' bad' : '') + '">'
              + '<div class="hd"><span class="st" style="color:' + (rt <= 2 ? 'var(--bad)' : 'var(--warn)') + '">'
              + (rt <= 2 ? '⚠️ ' : '') + rt.toFixed(1) + '점</span>'
              + '<span class="dt">' + esc(r.visited || '') + ' 방문</span></div>'
              + '<p>' + esc(r.body || '') + '</p></div>';
          }).join('')
        + '</div>';
    }
  }

  document.getElementById("app").innerHTML =
    '<div class="toolbar"><button class="back" id="back">← 전체 매장</button>'
    + '<span class="acts"><button class="copy2" id="copytxt">텍스트</button>'
    + '<button class="copy" id="copy">🖼 이미지 복사</button></span></div>'
    + '<div class="plat">네이버 플레이스</div>'
    + '<div class="tiles">'
    + '<div class="tile"><div class="l">평점' + (s.dScore > 0 ? ' <span class="d">▲' + s.dScore.toFixed(2) + '</span>' : '') + '</div>'
    + '<div class="v">' + (sc > 0 ? sc.toFixed(2) : '–') + '<span class="u"> /5</span></div></div>'
    + '<div class="tile"><div class="l">방문자 리뷰' + (s.dVisit > 0 ? ' <span class="d">▲' + s.dVisit + '</span>' : '') + '</div>'
    + '<div class="v">' + s.last.visitor_cnt + '<span class="u">개</span></div></div>'
    + '<div class="tile"><div class="l">블로그 리뷰' + (s.dBlog > 0 ? ' <span class="d">▲' + s.dBlog + '</span>' : '') + '</div>'
    + '<div class="v">' + s.last.blog_cnt + '<span class="u">개</span></div></div>'
    + '</div>'
    + kb
    + lowHtml
    + distHtml
    + wkHtml
    + '<div class="plat">날짜별 변화 (네이버)</div>'
    + '<div class="card"><table><thead><tr><th>날짜</th><th>평점</th><th>방문자</th><th>증감</th><th>블로그</th></tr></thead>'
    + '<tbody>' + trs + '</tbody></table></div>';

  document.getElementById("note").innerHTML =
    s.dayKeys.length + '일치 기록 · 숫자가 그대로면 새 리뷰가 없다는 뜻입니다';
  document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
  document.getElementById("copy").addEventListener("click", () => copyImage(s, dg));
  document.getElementById("copytxt").addEventListener("click", () => copyReport(s, dg));
  window.scrollTo({ top:0, behavior:"instant" });
}

/* ── 카톡·메일로 바로 보낼 수 있는 텍스트 리포트 ── */
function buildReport(s, dg) {
  const n = v => (v ?? 0).toLocaleString("ko-KR");
  const d = new Date(s.last.checked_at);
  const L = [];
  L.push("📊 " + s.name + " 리뷰 리포트");
  L.push(d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일 기준");
  const since = new Date(s.first.checked_at);
  const sinceTxt = (since.getMonth()+1) + "/" + since.getDate();
  L.push("");
  L.push("■ 네이버 플레이스");
  L.push("· 평점 " + (Number(s.last.score) > 0 ? Number(s.last.score).toFixed(2) : "집계 전")
    + (s.dScore > 0 ? "  (▲" + s.dScore.toFixed(2) + ")" : ""));
  L.push("· 방문자 리뷰 " + n(s.last.visitor_cnt) + "개" + (s.dVisit > 0 ? "  (▲" + n(s.dVisit) + ")" : ""));
  L.push("· 블로그 리뷰 " + n(s.last.blog_cnt) + "개" + (s.dBlog > 0 ? "  (▲" + n(s.dBlog) + ")" : ""));
  if (s.dVisit > 0 || s.dScore > 0) L.push("  ※ ▲는 " + sinceTxt + " 이후 증가분");

  // 직전 수집일 대비
  if (s.dayKeys.length >= 2) {
    const cur = s.days[s.dayKeys[s.dayKeys.length-1]];
    const prv = s.days[s.dayKeys[s.dayKeys.length-2]];
    const dv = cur.visitor_cnt - prv.visitor_cnt;
    const pd = new Date(prv.checked_at);
    if (dv !== 0) {
      L.push("· 직전(" + (pd.getMonth()+1) + "/" + pd.getDate() + ") 대비 방문자 리뷰 "
        + (dv > 0 ? "+" + n(dv) : n(dv)) + "개");
    }
  }

  if (s.kakao) {
    L.push("");
    L.push("■ 카카오맵");
    L.push("· " + (hasK(s.kakao) ? "평점 " + Number(s.kakao.score).toFixed(1) + " (리뷰 " + n(s.kakao.visitor_cnt) + "개)" : "리뷰 없음"));
    L.push("· 블로그 리뷰 " + n(s.kakao.blog_cnt) + "개");
  }

  if (dg && dg.total > 0) {
    L.push("");
    L.push("■ 최근 리뷰 " + dg.total + "건 분석");
    if (dg.avg) L.push("· 평균 " + dg.avg + "점");
    const t = dg.dist;
    L.push("· 5점 " + (t.five||0) + "건 / 4점대 " + (t.four||0) + "건 / 3점대 " + (t.three||0) + "건 / 2점 이하 " + (t.low||0) + "건");
    const lows = dg.lows || [];
    if (!lows.length) {
      L.push("· 3점 이하 리뷰 없음 — 깨끗합니다 ✓");
    } else {
      L.push("");
      L.push("■ 확인이 필요한 리뷰 " + lows.length + "건");
      lows.forEach(r => {
        L.push("· " + Number(r.rating).toFixed(1) + "점 (" + (r.visited || "") + " 방문)");
        L.push("  “" + String(r.body || "").trim() + "”");
      });
    }
  }
  L.push("");
  L.push("— 도반글로벌 리뷰 모니터링");
  return L.join("\n");
}

function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 2200);
}

/* ── 리포트를 이미지(PNG)로 그려서 복사/공유 ── */
const IMG = { w:1080, pad:64,
  bg:"#FFFFFF", ink:"#18231D", ink2:"#51605A", ink3:"#8A968F", line:"#E3E9E4",
  accent:"#0B7A45", accentSoft:"#E4F2EA", warn:"#A9690F", warnSoft:"#FBF0DC",
  bad:"#AE3325", badSoft:"#FAE8E5", kakao:"#FEE500" };
const F = (w, sz) => w + " " + sz + 'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';

function rrect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else {
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
  }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/), lines = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawReportImage(s, dg) {
  const W = IMG.w, P = IMG.pad, CW = W - P*2;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = 3400;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = IMG.bg; ctx.fillRect(0, 0, W, cv.height);
  ctx.textBaseline = "alphabetic";
  const n = v => (v ?? 0).toLocaleString("ko-KR");
  let y = P + 16;

  // 헤더
  ctx.fillStyle = IMG.accent; ctx.font = F("bold", 22);
  ctx.fillText("도반글로벌 · 리뷰 모니터링", P, y);
  y += 46;
  ctx.fillStyle = IMG.ink; ctx.font = F("bold", 52);
  ctx.fillText(s.name, P, y);
  y += 40;
  const d = new Date(s.last.checked_at);
  ctx.fillStyle = IMG.ink3; ctx.font = F("", 25);
  ctx.fillText(d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일 기준", P, y);
  y += 34;
  ctx.strokeStyle = IMG.line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W-P, y); ctx.stroke();
  y += 44;

  // 섹션 라벨
  const label = (t) => { ctx.fillStyle = IMG.ink3; ctx.font = F("bold", 21); ctx.fillText(t, P, y); y += 28; };

  // 네이버 지표 3칸
  label("네이버 플레이스");
  const bw = (CW - 24) / 3, bh = 132;
  const tiles = [
    ["평점", Number(s.last.score) > 0 ? Number(s.last.score).toFixed(2) : "–", s.dScore > 0 ? "▲" + s.dScore.toFixed(2) : ""],
    ["방문자 리뷰", n(s.last.visitor_cnt), s.dVisit > 0 ? "▲" + n(s.dVisit) : ""],
    ["블로그 리뷰", n(s.last.blog_cnt), s.dBlog > 0 ? "▲" + n(s.dBlog) : ""]
  ];
  tiles.forEach(([lb, val, dl], i) => {
    const x = P + i * (bw + 12);
    rrect(ctx, x, y, bw, bh, 18, "#FBFDFB", IMG.line);
    ctx.fillStyle = IMG.ink2; ctx.font = F("", 22);
    ctx.fillText(lb, x + 22, y + 40);
    if (dl) { ctx.fillStyle = IMG.accent; ctx.font = F("bold", 21);
      ctx.fillText(dl, x + 22 + ctx.measureText(lb).width + 44, y + 40); }
    ctx.fillStyle = IMG.ink; ctx.font = F("bold", 50);
    ctx.fillText(val, x + 22, y + 100);
  });
  y += bh + 18;
  if (s.dVisit > 0 || s.dScore > 0) {
    const sd = new Date(s.first.checked_at);
    ctx.fillStyle = IMG.ink3; ctx.font = F("", 20);
    ctx.fillText("▲는 " + (sd.getMonth()+1) + "/" + sd.getDate() + " 이후 증가분", P, y + 8);
    y += 26;
  }
  y += 22;

  // 카카오
  if (s.kakao) {
    label("카카오맵");
    const kh = 76;
    rrect(ctx, P, y, CW, kh, 16, "#FBFDFB", IMG.line);
    rrect(ctx, P + 20, y + 22, 108, 34, 8, IMG.kakao, null);
    ctx.fillStyle = "#3B1E1E"; ctx.font = F("bold", 20);
    ctx.fillText("카카오맵", P + 34, y + 46);
    ctx.fillStyle = IMG.ink2; ctx.font = F("", 24);
    const ktxt = (hasK(s.kakao) ? "평점 " + Number(s.kakao.score).toFixed(1) + " · 리뷰 " + n(s.kakao.visitor_cnt) + "개"
                                : "리뷰 없음") + "   ·   블로그 리뷰 " + n(s.kakao.blog_cnt) + "개";
    ctx.fillText(ktxt, P + 148, y + 48);
    y += kh + 34;
  }

  if (dg && dg.total > 0) {
    const lows = dg.lows || [];
    // 부정 리뷰
    if (lows.length) {
      label("확인이 필요한 리뷰 " + lows.length + "건");
      lows.forEach(r => {
        const rt = Number(r.rating);
        ctx.font = F("", 24);
        const lines = wrapText(ctx, "“" + String(r.body || "").trim() + "”", CW - 56);
        const h = 58 + lines.length * 34 + 16;
        rrect(ctx, P, y, CW, h, 14, rt <= 2 ? IMG.badSoft : IMG.warnSoft, null);
        rrect(ctx, P, y, 6, h, 3, rt <= 2 ? IMG.bad : IMG.warn, null);
        ctx.fillStyle = rt <= 2 ? IMG.bad : IMG.warn; ctx.font = F("bold", 23);
        ctx.fillText(rt.toFixed(1) + "점", P + 28, y + 38);
        ctx.fillStyle = IMG.ink3; ctx.font = F("", 21);
        ctx.fillText((r.visited || "") + " 방문", P + 28 + 76, y + 38);
        ctx.fillStyle = IMG.ink; ctx.font = F("", 24);
        lines.forEach((ln, i) => ctx.fillText(ln, P + 28, y + 76 + i * 34));
        y += h + 12;
      });
      y += 22;
    } else {
      const h = 70;
      rrect(ctx, P, y, CW, h, 14, IMG.accentSoft, null);
      ctx.fillStyle = IMG.accent; ctx.font = F("bold", 25);
      ctx.fillText("✓ 최근 리뷰 " + dg.total + "건 중 3점 이하 없음 — 깨끗합니다", P + 28, y + 45);
      y += h + 34;
    }

    // 별점 분포
    label("별점 분포   최근 리뷰 " + dg.total + "건" + (dg.avg ? " · 평균 " + dg.avg + "점" : ""));
    const rows = [["5점", dg.dist.five, IMG.accent], ["4점대", dg.dist.four, IMG.accent],
                  ["3점대", dg.dist.three, IMG.warn], ["2점 이하", dg.dist.low, IMG.bad]];
    const boxH = rows.length * 46 + 28;
    rrect(ctx, P, y, CW, boxH, 16, "#FBFDFB", IMG.line);
    let by = y + 44;
    rows.forEach(([lb, cnt, col]) => {
      ctx.fillStyle = IMG.ink2; ctx.font = F("", 22);
      ctx.fillText(lb, P + 24, by);
      const tx = P + 140, tw = CW - 140 - 120;
      rrect(ctx, tx, by - 20, tw, 22, 11, "#EFF3F0", null);
      const fw = Math.max(0, Math.round((cnt || 0) / dg.total * tw));
      if (fw > 0) rrect(ctx, tx, by - 20, fw, 22, 11, col, null);
      ctx.fillStyle = IMG.ink3; ctx.font = F("", 21);
      ctx.textAlign = "right"; ctx.fillText((cnt || 0) + "건", W - P - 24, by); ctx.textAlign = "left";
      by += 46;
    });
    y += boxH + 34;
  }

  // 푸터
  ctx.strokeStyle = IMG.line; ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W-P, y); ctx.stroke();
  y += 34;
  ctx.fillStyle = IMG.ink3; ctx.font = F("", 20);
  ctx.fillText("네이버 · 카카오맵 공개 데이터 기준 · 도반글로벌 리뷰 모니터링", P, y);
  y += P;

  // 사용한 높이만큼 잘라내기
  const out = document.createElement("canvas");
  out.width = W; out.height = y;
  const o = out.getContext("2d");
  o.fillStyle = IMG.bg; o.fillRect(0, 0, W, y);
  o.drawImage(cv, 0, 0);
  return out;
}

async function copyImage(s, dg) {
  let blob;
  try {
    const cv = drawReportImage(s, dg);
    blob = await new Promise(r => cv.toBlob(r, "image/png"));
  } catch (e) { toast("이미지를 만들지 못했어요"); return; }
  const file = new File([blob], (s.name + "_리뷰리포트.png"), { type: "image/png" });

  // 핸드폰: 공유 시트로 카톡에 바로 보내기
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (_) { /* 취소 시 아래로 */ }
  }
  // PC: 클립보드에 이미지 복사
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    toast("이미지 복사됐어요 · 붙여넣기 하세요");
    return;
  } catch (_) {}
  // 그래도 안 되면 파일로 저장
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = s.name + "_리뷰리포트.png";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("이미지로 저장했어요");
}

async function copyReport(s, dg) {
  const text = buildReport(s, dg);
  try {
    await navigator.clipboard.writeText(text);
    toast("복사됐어요 · 붙여넣기 하세요");
  } catch (_) {
    // 클립보드 권한이 막힌 환경 대비
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    toast(ok ? "복사됐어요 · 붙여넣기 하세요" : "복사 실패 — 길게 눌러 직접 복사해 주세요");
  }
}

function route() {
  const m = location.hash.match(/^#s=(.+)$/);
  if (m) renderDetail(decodeURIComponent(m[1]));
  else renderList();
}

(async function load() {
  try {
    const [res, dgRes] = await Promise.all([
      fetch(URL_RPC, { method:"POST", headers:{ apikey:KEY, "Content-Type":"application/json" }, body:"{}" }),
      fetch(URL_DIG, { method:"POST", headers:{ apikey:KEY, "Content-Type":"application/json" }, body:"{}" })
        .catch(() => null)
    ]);
    if (!res.ok) throw new Error("HTTP " + res.status);
    if (dgRes && dgRes.ok) { try { DIGEST = await dgRes.json() || {}; } catch (_) { DIGEST = {}; } }
    const rows = await res.json();
    if (!rows || !rows.length) {
      document.getElementById("app").innerHTML = '<div class="err">아직 수집된 데이터가 없습니다.</div>';
      document.getElementById("sub").textContent = ""; return;
    }
    build(rows);
    window.addEventListener("hashchange", route);
    route();
  } catch (e) {
    document.getElementById("app").innerHTML = '<div class="err">데이터를 불러오지 못했습니다. 잠시 후 새로고침 해주세요.</div>';
    document.getElementById("sub").textContent = "";
  }
})();
</script>
