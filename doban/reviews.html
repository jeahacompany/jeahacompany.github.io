<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도반 리뷰 현황</title>
<style>
  :root {
    --ground:#F6F8F6; --card:#FFFFFF; --ink:#1B2620; --ink-2:#52615A; --ink-3:#8A968F;
    --line:#E2E8E3; --accent:#0B7A45; --accent-soft:#E4F2EA; --bad:#B3372B; --bad-soft:#F8E7E4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#121815; --card:#1B2420; --ink:#E6EDE8; --ink-2:#A7B4AC; --ink-3:#6E7B74;
      --line:#2A362F; --accent:#4CC38A; --accent-soft:#1D3328; --bad:#E06A5C; --bad-soft:#3A1F1B; }
  }
  html { background:var(--ground); }
  body { font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    color:var(--ink); background:var(--ground); margin:0; padding:24px 16px 48px; line-height:1.6; }
  .wrap { max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .eyebrow { font-size:12px; letter-spacing:.12em; color:var(--accent); font-weight:700; }
  h1 { font-size:22px; margin:2px 0 0; }
  .sub { color:var(--ink-2); font-size:13px; margin-top:4px; }
  .store { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .store h2 { font-size:16px; margin:0 0 12px; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .tile { border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .tile .l { font-size:11.5px; color:var(--ink-2); }
  .tile .v { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
  .tile .u { font-size:12px; color:var(--ink-3); font-weight:400; }
  .tile .d { font-size:11.5px; color:var(--accent); font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--ink-2); font-size:11.5px; font-weight:600; padding:5px 6px; border-bottom:1px solid var(--line); }
  td { padding:6px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  .tablewrap { overflow-x:auto; }
  .note { font-size:12px; color:var(--ink-3); }
  .err { background:var(--bad-soft); color:var(--bad); border-radius:10px; padding:12px 16px; font-size:14px; }
  .loading { color:var(--ink-3); font-size:14px; padding:20px; text-align:center; }
  @media (max-width:480px) { .tiles { grid-template-columns:repeat(3,1fr); } .tile .v { font-size:19px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">도반글로벌 · 리뷰 모니터링</div>
    <h1>매장 리뷰 현황</h1>
    <div class="sub" id="asof">불러오는 중...</div>
  </header>
  <div id="app"><div class="loading">데이터를 불러오는 중입니다...</div></div>
  <p class="note">네이버 플레이스 공개 데이터 기준 · 수집 시각 자동 기록 · 숫자가 안 변하면 새 리뷰가 없다는 뜻입니다.</p>
</div>
<script>
const URL_RPC = "https://bgkdkfmdndhqgfdygmfm.supabase.co/rest/v1/rpc/review_feed";
const KEY = "sb_publishable_KxsYIOy5d4i7TR5PVBExLg_8UvNz6v9";

function fmtDay(iso) {
  const d = new Date(iso);
  const wd = ["일","월","화","수","목","금","토"][d.getDay()];
  return (d.getMonth()+1) + "/" + d.getDate() + "(" + wd + ")";
}
function fmtTime(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,"0");
  return (d.getMonth()+1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

async function load() {
  const app = document.getElementById("app");
  try {
    const res = await fetch(URL_RPC, { method:"POST",
      headers:{ apikey:KEY, "Content-Type":"application/json" }, body:"{}" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    if (!rows || !rows.length) { app.innerHTML = '<div class="err">아직 수집된 데이터가 없습니다.</div>'; return; }

    // 매장별로 묶기
    const stores = {};
    for (const r of rows) {
      (stores[r.store_name] = stores[r.store_name] || []).push(r);
    }
    let latestAll = rows[rows.length-1].checked_at;
    let html = "";
    for (const [name, list] of Object.entries(stores)) {
      list.sort((a,b) => a.checked_at < b.checked_at ? -1 : 1);
      const last = list[list.length-1];
      if (last.checked_at > latestAll) latestAll = last.checked_at;

      // 날짜별 마지막 값
      const byDay = {};
      for (const r of list) byDay[r.checked_at.slice(0,10)] = r;
      const days = Object.keys(byDay).sort().slice(-14).reverse();
      const first = byDay[Object.keys(byDay).sort()[0]];
      const dScore = (last.score - first.score).toFixed(2);
      const dVisit = last.visitor_cnt - first.visitor_cnt;

      let trs = "";
      for (const day of days) {
        const r = byDay[day];
        trs += "<tr><td>" + fmtDay(r.checked_at) + "</td><td>" + Number(r.score).toFixed(2)
             + "</td><td>" + r.visitor_cnt + "</td><td>" + r.blog_cnt + "</td></tr>";
      }
      html += '<section class="store"><h2>' + name + '</h2>'
        + '<div class="tiles">'
        + '<div class="tile"><div class="l">평점 ' + (dScore > 0 ? '<span class="d">▲' + dScore + '</span>' : '') + '</div><div class="v">' + Number(last.score).toFixed(2) + '<span class="u"> /5</span></div></div>'
        + '<div class="tile"><div class="l">방문자 리뷰 ' + (dVisit > 0 ? '<span class="d">▲' + dVisit + '</span>' : '') + '</div><div class="v">' + last.visitor_cnt + '<span class="u">개</span></div></div>'
        + '<div class="tile"><div class="l">블로그 리뷰</div><div class="v">' + last.blog_cnt + '<span class="u">개</span></div></div>'
        + '</div>'
        + '<div class="tablewrap"><table><thead><tr><th>날짜</th><th>평점</th><th>방문자</th><th>블로그</th></tr></thead><tbody>'
        + trs + '</tbody></table></div></section>';
    }
    app.innerHTML = html;
    document.getElementById("asof").textContent = "마지막 수집 " + fmtTime(latestAll) + " · 매일 자동 수집";
  } catch (e) {
    app.innerHTML = '<div class="err">데이터를 불러오지 못했습니다. 잠시 후 새로고침 해주세요. (' + e.message + ')</div>';
    document.getElementById("asof").textContent = "";
  }
}
load();
</script>
</body>
</html>
