<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>집먹 자사몰 수정요청</title>
<style>
  :root{
    --bg:#F7F7F8; --card:#fff; --line:#E6E8EB; --tx:#17181A; --sub:#6B7178;
    --pri:#FF6B00; --ok:#0F9D58; --wait:#8B5CF6; --hold:#9AA0A6; --big:#D93025;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       letter-spacing:-.02em;padding-bottom:90px}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px calc(14px - 4px)}
  header h1{margin:0;font-size:17px;font-weight:800}
  header p{margin:3px 0 0;font-size:12px;color:var(--sub)}
  .wrap{padding:14px 16px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 6px}
  input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;
       font-family:inherit;color:inherit;background:#fff}
  textarea{min-height:92px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13.5px;color:var(--sub);font-family:inherit}
  .chips button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;background:var(--pri);color:#fff;font-size:16px;font-weight:800;font-family:inherit}
  .btn:disabled{opacity:.5}
  .btn.sub{background:#fff;color:var(--tx);border:1px solid var(--line);font-weight:700}
  .shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .shots img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .addshot{width:74px;height:74px;border-radius:10px;border:1px dashed #C8CCD0;background:#fff;color:var(--sub);font-size:12px;font-family:inherit}
  .tabs{display:flex;gap:6px;overflow:auto;padding:0 16px 10px;max-width:760px;margin:0 auto}
  .tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--sub);font-family:inherit}
  .tabs button.on{background:#17181A;border-color:#17181A;color:#fff;font-weight:700}
  .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .item .top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:#F1F3F4;color:var(--sub)}
  .tag.s접수{background:#FFF1E6;color:#B84A00}
  .tag.s작업중{background:#EDE9FE;color:#5B21B6}
  .tag.s완료{background:#E6F4EA;color:#0B6B3A}
  .tag.s보류{background:#F1F3F4;color:#5F6368}
  .tag.s사장님확인{background:#FCE8E6;color:#B3261E}
  .item h3{margin:2px 0 4px;font-size:15.5px;font-weight:700;line-height:1.4}
  .item p{margin:0;font-size:13.5px;color:#3C4043;line-height:1.5;white-space:pre-wrap}
  .meta{margin-top:7px;font-size:12px;color:var(--sub)}
  .reply{margin-top:9px;padding:9px 11px;background:#F7F8F9;border-radius:10px;font-size:13px;color:#3C4043;white-space:pre-wrap}
  .reply b{color:var(--ok)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--sub);font-family:inherit}
  .empty{text-align:center;color:var(--sub);font-size:14px;padding:40px 0}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
       display:flex;padding:9px 12px calc(9px + env(safe-area-inset-bottom));gap:8px;z-index:30}
  .bar button{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;font-family:inherit;background:#F1F3F4;color:var(--sub)}
  .bar button.on{background:var(--pri);color:#fff}
  .hide{display:none !important}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#17181A;color:#fff;
         padding:11px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;z-index:50;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}
  .gate{padding:60px 22px;text-align:center}
  .gate input{text-align:center;font-size:18px;letter-spacing:.1em}
</style>
</head>
<body>

<div id="gate" class="gate hide">
  <h1 style="font-size:19px">집먹 자사몰 수정요청</h1>
  <p style="color:#6B7178;font-size:14px">받으신 접속코드를 넣어주세요.</p>
  <input id="gcode" type="text" placeholder="접속코드" style="margin:14px 0">
  <button class="btn" onclick="enter()">들어가기</button>
</div>

<div id="app" class="hide">
  <header>
    <h1>집먹 자사몰 수정요청</h1>
    <p id="hp">고칠 곳을 올려주세요. 간단한 건 바로 고쳐집니다.</p>
  </header>

  <!-- 올리기 -->
  <section id="tabWrite" class="wrap">
    <div class="card">
      <label>올리는 사람</label>
      <input id="writer" type="text" placeholder="이름" autocomplete="name">

      <label>어느 화면인가요</label>
      <div class="chips" id="areaChips"></div>

      <label>무엇으로 보셨나요</label>
      <div class="chips" id="devChips"></div>

      <label>한 줄로 무엇이 문제인가요</label>
      <input id="title" type="text" placeholder="예) 상품 옵션 글자가 잘려요">

      <label>자세히 (없으면 비워도 됩니다)</label>
      <textarea id="detail" placeholder="어떤 상품인지, 어떻게 하면 그렇게 되는지 적어주시면 빨리 고칩니다."></textarea>

      <label>사진 (있으면 제일 빠릅니다)</label>
      <div class="shots" id="shots">
        <button class="addshot" onclick="pick()">+ 사진</button>
      </div>
      <input id="file" type="file" accept="image/*" multiple class="hide" onchange="upload(this.files)">

      <div style="height:16px"></div>
      <button class="btn" id="send" onclick="send()">올리기</button>
    </div>
  </section>

  <!-- 목록 -->
  <section id="tabList" class="hide">
    <div class="tabs" id="tabs"></div>
    <div class="wrap" id="list"><div class="empty">불러오는 중…</div></div>
  </section>

  <div class="bar">
    <button id="bWrite" class="on" onclick="go('write')">＋ 올리기</button>
    <button id="bList" onclick="go('list')">요청 목록</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB = 'https://zcjvriedzememkiltqfa.supabase.co', KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjanZyaWVkemVtZW1raWx0cWZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjg2MTIsImV4cCI6MjA5OTYwNDYxMn0.2nZh82xFUNORqcKObAHUnz8K5EjjL-Nym0T4YkDHxMk';
const AREAS = ['메인화면','상품목록','상품상세','장바구니','주문서','검색','회원/로그인','기타'];
const DEVS = ['폰','피시'];
let CODE = '', area = '상품상세', dev = '폰', photos = [], filter = '전체';

const $ = (id) => document.getElementById(id);
function toast(s){ const t=$('toast'); t.textContent=s; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }

async function rpc(fn, body){
  const r = await fetch(SB + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{ apikey:KEY, authorization:'Bearer '+KEY, 'content-type':'application/json' },
    body: JSON.stringify(body)
  });
  const t = await r.text();
  if(!r.ok) throw new Error((()=>{ try{ return JSON.parse(t).message || t; }catch(e){ return t; } })());
  return t ? JSON.parse(t) : null;
}

/* 접속코드: 주소에 ?k= 로 오면 바로 통과하고 기억한다 */
function boot(){
  const u = new URL(location.href);
  const k = u.searchParams.get('k') || localStorage.getItem('zmreq_code') || '';
  if(k){ CODE = k; localStorage.setItem('zmreq_code', k); open_(); }
  else { $('gate').classList.remove('hide'); }
  $('writer').value = localStorage.getItem('zmreq_writer') || '';
  chips('areaChips', AREAS, (v)=>area=v, area);
  chips('devChips', DEVS, (v)=>dev=v, dev);
}
async function enter(){
  CODE = $('gcode').value.trim();
  try{ await rpc('zm_req_list', { p_code: CODE }); }
  catch(e){ toast('코드가 맞지 않습니다'); return; }
  localStorage.setItem('zmreq_code', CODE);
  $('gate').classList.add('hide'); open_();
}
function open_(){ $('app').classList.remove('hide'); }

function chips(id, list, set, cur){
  const box = $(id); box.innerHTML = '';
  list.forEach(v=>{
    const b = document.createElement('button');
    b.textContent = v; b.className = (v===cur?'on':'');
    b.onclick = ()=>{ set(v); [...box.children].forEach(c=>c.className=''); b.className='on'; };
    box.appendChild(b);
  });
}

function go(t){
  $('tabWrite').classList.toggle('hide', t!=='write');
  $('tabList').classList.toggle('hide', t!=='list');
  $('bWrite').className = t==='write' ? 'on':'';
  $('bList').className = t==='list' ? 'on':'';
  $('hp').textContent = t==='write' ? '고칠 곳을 올려주세요. 간단한 건 바로 고쳐집니다.' : '올라온 요청과 처리 상태입니다.';
  if(t==='list') load();
}

function pick(){ $('file').click(); }
async function upload(files){
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    toast('사진 올리는 중…');
    const name = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + (f.name.split('.').pop()||'jpg').toLowerCase();
    const r = await fetch(SB + '/storage/v1/object/zmreq/' + name, {
      method:'POST',
      headers:{ apikey:KEY, authorization:'Bearer '+KEY, 'content-type': f.type },
      body: f
    });
    if(!r.ok){ toast('사진 실패'); continue; }
    const url = SB + '/storage/v1/object/public/zmreq/' + name;
    photos.push(url);
    const img = document.createElement('img'); img.src = url;
    $('shots').insertBefore(img, $('shots').firstChild);
  }
  toast('사진 올렸습니다');
}

async function send(){
  const t = $('title').value.trim();
  if(!t){ toast('무엇이 문제인지 한 줄만 적어주세요'); return; }
  $('send').disabled = true;
  try{
    localStorage.setItem('zmreq_writer', $('writer').value.trim());
    await rpc('zm_req_add', {
      p_code: CODE, p_writer: $('writer').value.trim(), p_area: area, p_device: dev,
      p_title: t, p_detail: $('detail').value.trim(), p_photos: photos
    });
    $('title').value=''; $('detail').value=''; photos=[];
    $('shots').innerHTML = '<button class="addshot" onclick="pick()">+ 사진</button>';
    toast('올렸습니다. 확인하고 고치겠습니다');
    go('list');
  }catch(e){ toast('실패: ' + e.message); }
  $('send').disabled = false;
}

const STATUS = ['전체','접수','작업중','사장님확인','완료','보류'];
async function load(){
  chips('tabs', STATUS, (v)=>{ filter=v; draw(); }, filter);
  try{ window.ROWS = await rpc('zm_req_list', { p_code: CODE }); draw(); }
  catch(e){ $('list').innerHTML = '<div class="empty">' + e.message + '</div>'; }
}
function when(s){
  const d = new Date(s), now = new Date(), m = Math.round((now-d)/60000);
  if(m < 1) return '방금';
  if(m < 60) return m + '분 전';
  if(m < 60*24) return Math.round(m/60) + '시간 전';
  return (d.getMonth()+1) + '/' + d.getDate();
}
function draw(){
  const rows = (window.ROWS||[]).filter(r => filter==='전체' ? true : r.status===filter);
  if(!rows.length){ $('list').innerHTML = '<div class="empty">아직 없습니다.</div>'; return; }
  $('list').innerHTML = rows.map(r => `
    <div class="item">
      <div class="top">
        <span class="tag s${r.status}">${r.status}</span>
        ${r.big ? '<span class="tag s사장님확인">사장님 결정</span>' : ''}
        <span class="tag">${r.area}</span>
        <span class="tag">${r.device}</span>
      </div>
      <h3>${esc(r.title)}</h3>
      ${r.detail ? '<p>'+esc(r.detail)+'</p>' : ''}
      ${(r.photos||[]).length ? '<div class="shots">'+r.photos.map(p=>`<a href="${p}" target="_blank"><img src="${p}"></a>`).join('')+'</div>' : ''}
      <div class="meta">${esc(r.writer)} · ${when(r.created_at)}</div>
      ${r.reply ? '<div class="reply"><b>처리</b> '+esc(r.reply)+'</div>' : ''}
      <div class="acts">
        ${r.status!=='작업중' ? `<button onclick="upd(${r.id},'작업중')">작업중</button>`:''}
        ${r.status!=='완료' ? `<button onclick="upd(${r.id},'완료')">완료</button>`:''}
        ${r.status!=='보류' ? `<button onclick="upd(${r.id},'보류')">보류</button>`:''}
        <button onclick="askBig(${r.id},${r.big})">${r.big?'사장님 결정 해제':'사장님 결정으로'}</button>
        <button onclick="askReply(${r.id})">메모</button>
      </div>
    </div>`).join('');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function upd(id, status){
  try{ await rpc('zm_req_update', { p_code:CODE, p_id:id, p_status:status, p_reply:null, p_big:null }); toast(status+'으로 바꿨습니다'); load(); }
  catch(e){ toast('실패: '+e.message); }
}
async function askBig(id, cur){
  try{ await rpc('zm_req_update', { p_code:CODE, p_id:id, p_status:cur?'접수':'사장님확인', p_reply:null, p_big:!cur }); load(); }
  catch(e){ toast('실패: '+e.message); }
}
async function askReply(id){
  const v = prompt('처리 메모를 적어주세요');
  if(v===null) return;
  try{ await rpc('zm_req_update', { p_code:CODE, p_id:id, p_status:null, p_reply:v, p_big:null }); load(); }
  catch(e){ toast('실패: '+e.message); }
}
boot();
</script>
</body>
</html>
